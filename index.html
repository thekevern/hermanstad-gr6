aal en potlood."], "sections": [{"sectionTitle": "Afdeling A: Persentasies & Lengte", "totalSectionMarks": 12, "questions": [{"id": "em1_1", "num": "1.1", "type": "short", "q": "Skakel om na 'n persentasie: Marna behaal 18 uit 20 vir haar Wiskunde-toets. Bereken haar persentasie.", "expectedKeywords": ["90%"], "marks": 2, "cogLevel": "Toepassing", "memo": "1 punt: 18/20 = (18 × 5) / (20 × 5) = 90/100 ✓\n1 punt vir finale persentasie: 90% ✓"}, {"id": "em1_2", "num": "1.2", "type": "short", "q": "Bereken 15% van R60 met behulp van die 10% truuk.", "expectedKeywords": ["9", "R9"], "marks": 2, "cogLevel": "Toepassing", "memo": "1 punt: 10% van 60 = 6, en 5% = 3 ✓\n1 punt: 6 + 3 = R9 ✓"}, {"id": "em1_3", "num": "1.3", "type": "short", "q": "'n Paar tekkies kos R400. Die winkel bied 25% afslag aan. Bereken: (a) die afslagbedrag (b) die bedrag wat jy betaal.", "expectedKeywords": ["100", "300"], "marks": 3, "cogLevel": "Toepassing", "memo": "1 punt: 25% van R400 = R400 ÷ 4 = R100 afslag ✓\n2 punte: R400 − R100 = R300 betaalbaar ✓✓"}, {"id": "em1_4", "num": "1.4", "type": "short", "q": "Voltooi die omskakelings:\n(a) 3,5 km = _____ m\n(b) 245 cm = _____ m\n(c) 68 mm = _____ cm", "expectedKeywords": ["3500", "2.45", "6.8"], "marks": 3, "cogLevel": "Kennis & Toepassing", "memo": "(a) 3 500 m ✓\n(b) 2,45 m ✓\n(c) 6,8 cm ✓"}, {"id": "em1_5", "num": "1.5", "type": "short", "q": "STRIKVRAAG: Bereken: 2 m + 40 cm. Skryf jou finale antwoord in sentimeter (cm).", "expectedKeywords": ["240", "240 cm"], "marks": 2, "cogLevel": "Begrip (Strikvraag)", "memo": "1 punt: 2 m = 200 cm ✓\n1 punt: 200 cm + 40 cm = 240 cm ✓"}]}, {"sectionTitle": "Afdeling B: 2D-Vorms, 3D-Voorwerpe & Euler", "totalSectionMarks": 14, "questions": [{"id": "em1_6", "num": "2.1", "type": "short", "q": "Benoem die volgende hoeke volgens hul grootte:\n(a) 'n Hoek van 65°\n(b) 'n Hoek van 90°\n(c) 'n Hoek van 135°\n(d) 'n Hoek van 180°", "expectedKeywords": ["skerphoek", "regte hoek", "stomphoek", "gestrekte hoek"], "marks": 4, "cogLevel": "Kennis", "memo": "(a) Skerphoek ✓\n(b) Regte hoek ✓\n(c) Stomphoek ✓\n(d) Gestrekte hoek / Reguitlynhoek ✓"}, {"id": "em1_7", "num": "2.2", "type": "short", "q": "Twee binnehoeke van 'n driehoek is 55° en 65°. Bereken die grootte van die derde hoek.", "expectedKeywords": ["60", "60°"], "marks": 2, "cogLevel": "Toepassing", "memo": "1 punt: 55° + 65° = 120° (som is 180°) ✓\n1 punt: 180° − 120° = 60° ✓"}, {"id": "em1_8", "num": "2.3", "type": "short", "q": "Watter vierhoek het presies net EEN paar ewewydige sye?", "expectedKeywords": ["trapesium"], "marks": 1, "cogLevel": "Kennis", "memo": "1 punt vir Trapesium ✓"}, {"id": "em1_9", "num": "2.4", "type": "short", "q": "Voltooi die tabel vir 'n Driehoekige Prisma:\n(a) Aantal vlakke = _____\n(b) Aantal rande = _____\n(c) Aantal hoekpunte = _____", "expectedKeywords": ["5", "9", "6"], "marks": 3, "cogLevel": "Kennis", "memo": "(a) 5 vlakke (2 driehoeke, 3 reghoeke) ✓\n(b) 9 rande ✓\n(c) 6 hoekpunte ✓"}, {"id": "em1_10", "num": "2.5", "type": "short", "q": "Toets Euler se toorformule (V + H − R = 2) op 'n kubus. Wys jou syfers en bewerking.", "expectedKeywords": ["6 + 8 - 12 = 2", "14 - 12 = 2"], "marks": 2, "cogLevel": "Toepassing", "memo": "1 punt vir die waardes: V = 6, H = 8, R = 12 ✓\n1 punt vir berekening: 6 + 8 − 12 = 14 − 12 = 2 ✓"}, {"id": "em1_11", "num": "2.6", "type": "short", "q": "Hoeveel simmetrielyne het: (a) 'n vierkant (b) 'n reghoek?", "expectedKeywords": ["4", "2"], "marks": 2, "cogLevel": "Kennis", "memo": "(a) Vierkant = 4 simmetrielyne ✓\n(b) Reghoek = 2 simmetrielyne ✓"}]}, {"sectionTitle": "Afdeling C: Meting (Omtrek, Oppervlakte & Volume)", "totalSectionMarks": 14, "questions": [{"id": "em1_12", "num": "3.1", "type": "short", "q": "'n Sokkerveld is 100 m lank en 60 m breed.\n(a) Skryf die formule vir omtrek neer en bereken die omtrek.\n(b) Skryf die formule vir oppervlakte neer en bereken die oppervlakte.", "expectedKeywords": ["320", "320 m", "6000", "6000 m²"], "marks": 6, "cogLevel": "Toepassing", "memo": "(a) Formule: 2 × (L + B) [1 punt]; Berekening: 2 × 160 = 320 m [2 punte met eenheid]\n(b) Formule: L × B [1 punt]; Berekening: 100 × 60 = 6 000 m² [2 punte met eenheid m²]"}, {"id": "em1_13", "num": "3.2", "type": "short", "q": "'n Graankosboks is 20 cm hoog, 15 cm lank en 5 cm breed. Bereken die volume van die boks.", "expectedKeywords": ["1500", "1500 cm³"], "marks": 3, "cogLevel": "Toepassing", "memo": "1 punt vir formule: L × B × H ✓\n1 punt vir bewerking: 15 × 5 × 20 ✓\n1 punt vir finale antwoord met eenheid: 1 500 cm³ ✓"}, {"id": "em1_14", "num": "3.3", "type": "short", "q": "Omskakeling van kapasiteit:\n(a) 1 cm³ = _____ ml\n(b) 2,5 liter = _____ ml\n(c) 3 200 ml = _____ liter", "expectedKeywords": ["1", "2500", "3.2"], "marks": 3, "cogLevel": "Kennis", "memo": "(a) 1 ml ✓\n(b) 2 500 ml ✓\n(c) 3,2 liter (of 3 ℓ 200 ml) ✓"}, {"id": "em1_15", "num": "3.4", "type": "short", "q": "RAAISEL: Wat weeg swaarder – 1 kg vere of 1 kg bakstene? Verduidelik jou antwoord.", "expectedKeywords": ["ewe swaar", "albei 1 kg"], "marks": 2, "cogLevel": "Begrip & Redenering", "memo": "1 punt: Hulle weeg presies ewe swaar ✓\n1 punt: Albei weeg presies 1 kg (1 000 g) ongeag die digtheid of materiaal ✓"}]}, {"sectionTitle": "Afdeling D: Tyd & Datahantering", "totalSectionMarks": 10, "questions": [{"id": "em1_16", "num": "4.1", "type": "short", "q": "Skakel die tye om na 24-uur notasie:\n(a) 07:15 vm. = _____\n(b) 02:30 nm. = _____\n(c) 11:45 nm. = _____", "expectedKeywords": ["07:15", "14:30", "23:45"], "marks": 3, "cogLevel": "Kennis", "memo": "(a) 07:15 ✓\n(b) 14:30 ✓\n(c) 23:45 ✓"}, {"id": "em1_17", "num": "4.2", "type": "short", "q": "Die netbalwedstryd begin 08:45 en eindig om 11:20. Bereken die tydsverloop in ure en minute.", "expectedKeywords": ["2 h 35 min", "2 uur 35 minute"], "marks": 3, "cogLevel": "Toepassing", "memo": "1 punt vir metode (08:45 na 09:00 = 15 min; 09:00 na 11:00 = 2 h; 11:00 na 11:20 = 20 min) ✓\n2 punte vir finale ant erskil tussen 'n attributiewe en 'n predikatiewe byvoeglike naamwoord? Gee 'n voorbeeld van elkeen met die woord 'koud'.", "expectedKeywords": ["attributief voor", "koue water", "predikatief na", "water is koud"], "marks": 2, "cogLevel": "Begrip", "memo": "1 punt: Attributief staan VOOR die naamwoord en kry 'n -e (bv. die koue water) ✓\n1 punt: Predikatief staan NÁ die werkwoord sonder -e (bv. die water is koud) ✓"}]}, {"sectionTitle": "Afdeling B: Werkwoorde, Tye & Ontkenning", "totalSectionMarks": 10, "questions": [{"id": "ea_4", "num": "2.1", "type": "short", "q": "Skryf die sin in die Verlede Tyd: 'Ons vergeet die Afrikaans-boek by die huis.'", "expectedKeywords": ["het die afrikaans-boek by die huis vergeet"], "marks": 2, "cogLevel": "Toepassing (Strikvraag)", "memo": "1 punt vir 'het' in v1-posisie ✓\n1 punt vir 'vergeet' aan die einde SONDER ge- (BE-GE-ER-HER-ONT-VER kry geen ge- nie!) ✓"}, {"id": "ea_5", "num": "2.2", "type": "short", "q": "Gee die verlede tyd van die volgende spesiale werkwoorde:\n(a) Hy is siek. → Gister _____ hy siek.\n(b) Hulle het 'n hond. → Verlede jaar _____ hulle 'n hond _____. \n(c) Sy wil huis toe gaan. → Sy _____ huis toe gaan.", "expectedKeywords": ["was", "het", "gehad", "wou"], "marks": 4, "cogLevel": "Kennis", "memo": "(a) was ✓\n(b) het ... gehad [2 punte] ✓✓\n(c) wou ✓"}, {"id": "ea_6", "num": "2.3", "type": "short", "q": "Skryf die sin in die Ontkennende Vorm (negatief):\n'Iemand het iets in die klaskamer laat val.'", "expectedKeywords": ["niemand het niks in die klaskamer laat val nie"], "marks": 2, "cogLevel": "Toepassing", "memo": "1 punt vir Niemand het niks... ✓\n1 punt vir die dubbele 'nie' aan die einde ✓"}, {"id": "ea_7", "num": "2.4", "type": "short", "q": "Rangskik die woorde volgens die T-M-P reël:\n'Die kinders ry (skool toe / met die bus / elke oggend).'", "expectedKeywords": ["elke oggend met die bus skool toe"], "marks": 2, "cogLevel": "Toepassing", "memo": "1 punt vir Tyd (elke oggend) voor Manier (met die bus) ✓\n1 punt vir Plek (skool toe) laaste ✓"}]}, {"sectionTitle": "Afdeling C: Voegwoorde & Saamgestelde Sinne", "totalSectionMarks": 10, "questions": [{"id": "ea_8", "num": "3.1", "type": "short", "q": "Verbind met 'want' (Groep 1 EMOW): 'Sy leer hard. Sy wil goeie punte kry.'", "expectedKeywords": ["sy leer hard, want sy wil goeie punte kry"], "marks": 2, "cogLevel": "Toepassing", "memo": "2 punte: Sy leer hard, want sy wil goeie punte kry. (Woordorde bly presies dieselfde!) ✓✓"}, {"id": "ea_9", "num": "3.2", "type": "short", "q": "Verbind met 'daarom' (Groep 2): 'Dit reën baie hard. Ons kan nie buite speel nie.'", "expectedKeywords": ["daarom kan ons nie buite speel nie"], "marks": 2, "cogLevel": "Toepassing", "memo": "2 punte: Dit reën baie hard, daarom KAN ons nie buite speel nie. (Werkwoord 'kan' kom direk ná daarom!) ✓✓"}, {"id": "ea_10", "num": "3.3", "type": "short", "q": "Verbind met 'omdat' (Groep 3): 'Hy kom laat by die skool aan. Hy het sy wekker afgeskakel.'", "expectedKeywords": ["omdat hy sy wekker afgeskakel het"], "marks": 2, "cogLevel": "Toepassing", "memo": "2 punte: Hy kom laat by die skool aan omdat hy sy wekker afgeskakel HET. (Werkwoord 'het' skuif stert-toe!) ✓✓"}, {"id": "ea_11", "num": "3.4", "type": "short", "q": "Vul die korrekte vaste voorsetsels in:\n(a) Die seun is baie bang _____ slange.\n(b) Sy ma is trots _____ haar prestasie.\n(c) Ek dink dikwels _____ my oupa.\n(d) Ons glo _____ harde werk.", "expectedKeywords": ["vir", "op", "aan", "in"], "marks": 4, "cogLevel": "Kennis", "memo": "(a) vir ✓\n(b) op ✓\n(c) aan ✓\n(d) in ✓"}]}, {"sectionTitle": "Afdeling D: Skryftekens & Foutkorreksie", "totalSectionMarks": 10, "questions": [{"id": "ea_12", "num": "4.1", "type": "short", "q": "STRIKVRAAG: Korrigeer die volgende sin sodat al die hoofletters en skryftekens reg is:\n'N hond blaf baie hard in die reen.", "expectedKeywords": ["'n hond", "'n Hond", "reën"], "marks": 3, "cogLevel": "Toepassing (Strikvraag)", "memo": "1 punt: 'n bly klein watter negatief (−) is.", "expectedKeywords": ["lang dun lyn positief", "kort dik lyn negatief"], "marks": 2, "cogLevel": "Kennis", "memo": "1 punt: Twee parallelle lyne: lang dun lyn is die positiewe (+) pool ✓\n1 punt: Kort dik lyn is die negatiewe (−) pool ✓"}, {"id": "en_3", "num": "1.3", "type": "short", "q": "Wat is die energie-omskakeling in 'n brandende flitslig?", "expectedKeywords": ["chemies", "elektries", "lig", "hitte"], "marks": 3, "cogLevel": "Begrip", "memo": "1 punt: Chemiese energie (in sel) ✓\n1 punt: na Elektriese energie (in drade) ✓\n1 punt: na Lig- en Hitte-energie (in gloeilamp) ✓"}, {"id": "en_4", "num": "1.4", "type": "short", "q": "Noem twee elektriese geleiers en twee isoleerders. Waarom het 'n kragdraad koper binne en plastiek buite?", "expectedKeywords": ["koper", "grafiet", "plastiek", "rubber", "isoleerder beskerm skokke"], "marks": 4, "cogLevel": "Toepassing", "memo": "1 punt vir geleiers (koper, aluminium, yster, grafiet) ✓\n1 punt vir isoleerders (plastiek, rubber, glas, hout) ✓\n2 punte: Koper binne gelei die stroom maklik; plastiek buite isoleer en beskerm mense teen elektriese skokke ✓✓"}]}, {"sectionTitle": "Afdeling B: Tegnologie & Kragstasies", "totalSectionMarks": 14, "questions": [{"id": "en_5", "num": "2.1", "type": "short", "q": "Noem die 5 stappe van die Tegnologiese Ontwerpproses (O-O-M-E-K) volgens die rympie 'Ons Ontwerp, Maak, Evalueer en Kommunikeer'.", "expectedKeywords": ["ondersoek", "ontwerp", "maak", "evalueer", "kommunikeer"], "marks": 5, "cogLevel": "Kennis", "memo": "1. Ondersoek ✓\n2. Ontwerp ✓\n3. Maak ✓\n4. Evalueer ✓\n5. Kommunikeer ✓"}, {"id": "en_6", "num": "2.2", "type": "short", "q": "Beskryf stap-vir-stap hoe elektrisiteit in 'n steenkoolkragstasie (soos Eskom) opgewek word totdat dit by jou huis kom.", "expectedKeywords": ["steenkool brand", "water kook stoom", "turbine draai", "generator", "kragdrade substasie"], "marks": 5, "cogLevel": "Toepassing", "memo": "1 punt: Steenkool brand in 'n oond ✓\n1 punt: Kook water in groot ketels om hoëdruk stoom te vorm ✓\n1 punt: Stoom laat turbine draai ✓\n1 punt: Turbine dryf generator aan om elektrisiteit op te wek ✓\n1 punt: Hoogspanningsdrade en substasies neem krag na huise ✓"}, {"id": "en_7", "num": "2.3", "type": "short", "q": "Wat is Suid-Afrika se enigste kernkragstasie en noem 2 voordele van hernubare energie (soos son en wind) bo steenkool.", "expectedKeywords": ["koeberg", "raak nie op nie", "geen besoedeling", "skoon"], "marks": 4, "cogLevel": "Begrip", "memo": "2 punte: Koeberg naby Kaapstad ✓✓\n2 punte vir voordele: Hernubare bronne raak nooit op nie en veroorsaak geen lugbesoedeling of kweekhuisgasse nie ✓✓"}]}, {"sectionTitle": "Afdeling C: Sonnestelsel & Ruimteverkenning", "totalSectionMarks": 14, "questions": [{"id": "en_8", "num": "3.1", "type": "short", "q": "Noem die 8 planete in volgorde van die Son af met behulp van die rympie 'Ma Vat Elke Môre Jellie Saam Uit Nylstroom'.", "expectedKeywords": ["mercurius", "venus", "aarde", "mars", "jupiter", "saturnus", "uranus", "neptunus"], "marks": 4, "cogLevel": "Kennis", "memo": "4 punte (½ punt elk): Mercurius, Venus, Aarde, Mars, Jupiter, Saturnus, Uranus, Neptunus ✓✓✓✓"}, {"id": "en_9", "num": "3.2", "type": "short", "q": "Verduidelik die verskil tussen die Aarde se ROTASIE en WENTELING. Wat veroorsaak elkeen?", "expectedKeywords": ["roteer om eie as 24 uur dag en nag", "wentel om son 365 dae seisoene"], "marks": 4, "cogLevel": "Begrip", "memo": "2 punte: Roteer = Aarde draai om eie as elke 24 uur → veroorsaak DAG EN NAG ✓✓\n2 punte: Wentel = Aarde beweeg om die Son in 365¼ dae → veroorsaak SEISOENE (saam met skuins as) ✓✓"}, {"id": "en_10", "num": "3.3", "type": "short", "q": "Noem twee groot teleskope in Suid-Afrika en gee 2 redes waarom die Karoo (Noord-Kaap) ideaal is vir ruimte-waarneming.", "expectedKeywords": ["salt", "meerkat", "ska", "donker lug geen ligbesoedeling", "wolkloos droog"], "marks": 4, "cogLevel": "Toepassing", "memo": "2 punte: SALT   // 1. BREUKE: PIZZA WITH MOVING ANIMATED SLICES
  renderPizza(step) {
    // 8 slices. In step 0: 0 eaten. Step 1: 3 eaten (Shenique). Step 2: 5 eaten (+ Shenique). Step 3: 3 remaining for Pappa.
    const eatenCount = (step === 0) ? 0 : (step === 1 ? 3 : (step === 2 ? 5 : 5));
    const isPappaStep = (step === 3);

    let slices = '';
    for (let i = 0; i < 8; i++) {
      const angle = (i * 45) - 90;
      const rad1 = (angle * Math.PI) / 180;
      const rad2 = ((angle + 44) * Math.PI) / 180;
      const r = 68;
      const cx = 100, cy = 90;
      const x1 = cx + r * Math.cos(rad1);
      const y1 = cy + r * Math.sin(rad1);
      const x2 = cx + r * Math.cos(rad2);
      const y2 = cy + r * Math.sin(rad2);

      const isEaten = i < eatenCount;
      let transform = '';
      let fill = isEaten ? '#f1f5f9' : '#f59e0b';
      let stroke = isEaten ? '#cbd5e1' : '#b45309';

      if (isEaten) {
        // Slide slice outward with animation
        const midRad = ((angle + 22) * Math.PI) / 180;
        const dx = Math.cos(midRad) * 22;
        const dy = Math.sin(midRad) * 22;
        transform = `transform="translate(${dx.toFixed(1)}, ${dy.toFixed(1)})" opacity="0.35"`;
      } else if (isPappaStep) {
        fill = '#10b981';
        stroke = '#047857';
      }

      slices += `
        <g ${transform} style="transition: all 0.5s ease-out;">
          <path d="M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 0,1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" 
                fill="${fill}" stroke="${stroke}" stroke-width="2"/>
          ${!isEaten ? `<circle cx="${(cx + (x1+x2)/2)/2}" cy="${(cy + (y1+y2)/2)/2}" r="3.5" fill="#dc2626"/>` : ''}
        </g>
      `;
    }

    let badgeText = step === 0 ? "Hele Pizza: 8/8" :
                    step === 1 ? "Shenique eet 3 snye: 3/8" :
                    step === 2 ? "Saam geëet: 3/8 + 2/8 = 5/8" :
                    "Oor vir Pappa: 8/8 - 5/8 = 3/8 💚";

    return `

        </text>
        <text x="250" y="96" fill="#facc15" font-size="10" font-weight="700" text-anchor="middle">
          ${step === 0 ? "Heelgetal = 1" : (step === 1 ? "Teller = 3 (Bo)" : (step === 2 ? "Noemer = 8 (Onder)" : "Pappa se Deel!"))}

          ${step === 2 ? "3/8 + 2/8 = 5/8" : (step === 3 ? "8/8 - 5/8 = 3/8" : "Noemer bly 8!")}
        </text>
      </svg>

    const cx = 110, cy = 130, len = 75;
    const ax = cx + len * Math.cos(Math.PI - rad);
    const ay = cy - len * Math.sin(Math.PI - rad);

    const typeName = targetAngle < 90 ? "Skerphoek (< 90°)" :
                     targetAngle === 90 ? "Regte hoek (= 90°)" :
                     targetAngle < 180 ? "Stomphoek (90° - 180°)" : "Gestrekte hoek (= 180°)";

    return `
      <svg viewBox="0 0 320 180" width="100%" height="100%" style="background:#0f172a; border-radius:12px;">

        <path d="M35,130 A75,75 0 0,1 185,130 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2" opacity="0.85"/>
        <line x1="35" y1="130" x2="185" y2="130" stroke="#f8fafc" stroke-width="2.5"/>
        <circle cx="${cx}" cy="${cy}" r="4" fill="#ef4444"/>

        <!-- Fixed base arm -->
        <line x1="${cx}" y1="${cy}" x2="${cx + len}" y2="${cy}" stroke="#22c55e" stroke-width="3"/>
        
        <!-- Moving angle arm -->
        <line x1="${cx}" y1="${cy}" x2="${ax.toFixed(1)}" y2="${ay.toFixed(1)}" stroke="#f59e0b" stroke-width="3" style="transition: all 0.4s ease;"/>
        <circle cx="${ax.toFixed(1)}" cy="${ay.toFixed(1)}" r="4" fill="#f59e0b"/>

        <!-- Angle Arc -->
        <path d="M${cx+25},${cy} A25,25 0 0,0 ${cx + 25*Math.cos(Math.PI-rad)},${cy - 25*Math.sin(Math.PI-rad)}" fill="none" stroke="#eab308" stroke-width="2"/>

        <rect x="195" y="25" width="115" height="130" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>

        <text x="252" y="85" fill="#facc15" font-size="22" font-weight="900" text-anchor="middle">${targetAngle}°</text>
        <text x="252" y="110" fill="#f8fafc" font-size="10" font-weight="800" text-anchor="middle">${typeName}</text>

        <rect x="202" y="122" width="100" height="24" rx="4" fill="#0f172a"/>

// --- AUDIO CHIMES ---
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playSuccessChime() {
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523.25, now);
    osc.frequency.setValueAtTime(659.25, now + 0.1);
    osc.frequency.setValueAtTime(783.99, now + 0.2);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    osc.start(now);
    osc.stop(now + 0.45);
  } catch(e) {}
}
function playAlertChime() {
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(440, now);
    osc.frequency.setValueAtTime(880, now + 0.15);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    osc.start(now);
    osc.stop(now + 0.4);
  } catch(e) {}
}

// --- 14:00 EXAM DAY CUTOFF & COUNTDOWN ENGINE ---
function isExamCompleted(dateStr) {
  const now = state.simulatedTime ? new Date(state.simulatedTime) : new Date();
  const examCutoff = new Date(dateStr + 'T14:00:00');
  return now >= examCutoff;
}

function getExamCountdown(dateStr) {
  const now = state.simulatedTime ? new Date(state.simulatedTime) : new Date();
  const examStart = new Date(dateStr + 'T08:00:00');
  const examCutoff = new Date(dateStr + 'T14:00:00');

  if (now >= examCutoff) {
    return { text: '✓ Reeds geskryf', badgeClass: 'countdown-badge badge-done', daysDiff: -999 };
  }

  const todayZero = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const examZero = new Date(examStart.getFullYear(), examStart.getMonth(), examStart.getDate());
  const diffDays = Math.round((examZero - todayZero) / (1000 * 60 * 60 * 24));

  if (diffDays === 0) {
    return { text: '🚨 VANDAG!', badgeClass: 'countdown-badge badge-urgent', daysDiff: 0 };
  } else if (diffDays === 1) {
    return { text: '⚠️ MÔRE!', badgeClass: 'countdown-badge badge-urgent', daysDiff: 1 };
  } else if (diffDays <= 3) {
    return { text: `Nog ${diffDays} dae`, badgeClass: 'countdown-badge badge-soon', daysDiff: diffDays };
  } else {
    return { text: `Nog ${diffDays} dae`, badgeClass: 'countdown-badge badge-future', daysDiff: diffDays };
  }
}

function setSimulatedTime(timeStr) {
  state.simulatedTime = timeStr;
  document.querySelectorAll('.btn-sim-chip').forEach(b => b.classList.remove('active'));
  
  const lbl = document.getElementById('sim-time-label');

    const d = new Date(timeStr);
    lbl.innerText = `Gesimuleer: ${d.getDate()} Nov ${d.getHours()}:${d.getMinutes().toString().padStart(2, '0')}`;
  } else {
    lbl.innerText = "Werklike Tyd (Vandag)";
    const chipToday = document.getElementById('chip-today');
    if (chipToday) chipToday.classList.add('active');
  }
  renderMissions();
}

function launchSubjectActivity(mid, modeId) {

  state.activeMode = modeId;

  document.body.classList.add('in-mode');
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  const targetTab = document.getElementById(`tab-${modeId}`);
  if (targetTab) targetTab.classList.add('active');

  const titles = {
    'klas': '🎓 Klas & Video',

  };

  document.getElementById('fs-nav-title').innerText = `${m.icon} ${m.name}`;
  const backBtn = document.getElementById('btn-fs-back');
  if (backBtn) {
    backBtn.innerHTML = `← ${m.name}`;
    backBtn.onclick = () => openSubjectHub(mid);
  }

  if (modeId === 'flashcards') {
    state.activeSubject = mid;
    state.activeBoxFilter = 'all';
    applyCardFilters();
  } else if (modeId === 'quizzes') {
    startQuizForSubject(mid);
  } else if (modeId === 'klas') {
    loadKlasForSubject(mid);
  } else if (modeId === 'simulator') {
    const paper = examPapers.find(p => p.mid === mid || (p.id && p.id.includes(mid)));
    if (paper) loadExamPaper(paper.id);
  } else if (modeId === 'weakness') {
    renderWeaknessList();
  }
}

function goBack() {

// --- SCREEN 3A: FLASHCARDS ENGINE ---
function applyCardFilters() {
  const mid = state.activeSubject;
  const boxFilter = state.activeBoxFilter;

  let list = flashcards.filter(c => c.mid === mid);
  if (boxFilter === '1') {
    list = list.filter(c => (state.boxStats[c.id] || 1) === 1);
  } else if (boxFilter === '2') {
    list = list.filter(c => (state.boxStats[c.id] || 1) === 2);
  } else if (boxFilter === '3') {
    list = list.filter(c => (state.boxStats[c.id] || 1) === 3);
  }

  state.currentDeck = list;
  state.currentCardIdx = 0;
  state.isFlipped = false;

  renderDeckSelector();
  renderCurrentCard();
}

function renderDeckSelector() {
  const container = document.getElementById('fc-deck-selector-container');
  if (!container) return;

  const mid = state.activeSubject;
  const allSubCards = flashcards.filter(c => c.mid === mid);

// FUZZY SPELLING TOLERANCE (SPELLING MISTAKES ARE COUNTED CORRECT)
function isFuzzyMatch(userStr, targetStr) {
  if (!userStr || !targetStr) return false;
  const u = userStr.toLowerCase().trim();
  const t = targetStr.toLowerCase().trim();
  if (u.includes(t) || t.includes(u)) return true;

  // Simple character difference count
  let diff = Math.abs(u.length - t.length);
  const minLen = Math.min(u.length, t.length);
  for (let i = 0; i < minLen; i++) {
    if (u[i] !== t[i]) diff++;
  }
  return diff <= 2; // Allow up to 2 typos / spelling mistakes
}

function submitExamPaper() {
  clearInterval(simInterval);
  const paper = examPapers.find(p => p.id === state.activeExamId);
  if (!paper) return;

  let totalMarks = 0;
  let earnedMarks = 0;

  paper.sections.forEach(sec => {
    sec.questions.forEach(q => {
      totalMarks += q.marks;
      const userAns = state.simAnswers[q.id];
      const feed = document.getElementById(`sim_feedback_${q.id}`);
      let qEarned = 0;

      if (q.type === 'mcq') {
        if (userAns !== undefined && parseInt(userAns) === q.answer) {
          qEarned = q.marks;
        }
      } else {
        // Keyword evaluation with spelling mistake tolerance
        const expected = q.expectedKeywords || [];
        const userText = (userAns || '').toString().toLowerCase();
        let matchedCount = 0;
        expected.forEach(kw => {
          if (isFuzzyMatch(userText, kw)) matchedCount++;
        });

        if (expected.length > 0) {
          const fraction = Math.min(1, matchedCount / Math.max(1, expected.length * 0.6));
          qEarned = Math.round(fraction * q.marks);
        } else {
          if (userText.length > 3) qEarned = q.marks;
        }
      }

      earnedMarks += qEarned;
      if (feed) {
        feed.style.display = 'block';
        feed.style.background = qEarned === q.marks ? '#f0fdf4' : (qEarned > 0 ? '#fffbeb' : '#fef2f2');
        feed.style.border = `1px solid ${qEarned === q.marks ? '#86efac' : (qEarned > 0 ? '#fde68a' : '#fca5a5')}`;
        feed.innerHTML = `<strong>Telling: ${qEarned} / ${q.marks}</strong><br><span style="color:#475569;">${nl2br(q.memo)}</span>`;
      }
    });
  });

  const pct = Math.round((earnedMarks / totalMarks) * 100);
  playSuccessChime();
  alert(`📝 Vraestel gemerk!

Telling: ${earnedMarks} / ${totalMarks} (${pct}%)

Spelfoute is verskoon en as korrek getel solank die kernbegrip daar is!`);
  stuurVirPappa();
}

        <span style="background:#fef2f2; border:1px solid #fecaca; color:#dc2626; font-size:0.7rem; font-weight:900; padding:0.15rem 0.5rem; border-radius:999px;">${count}× hersien</span>
      </div>
    `;
    container.appendChild(row);
  });
}

function startTargetedDrill() {
  state.activeBoxFilter = '1';
  launchSubjectActivity(state.currentSubjectId || 'm1', 'flashcards');
}
