, dikwels verkeerde idee oor 'n hele groep mense (bv. 'seuns huil nie' of 'meisies kan nie sokker speel nie').\n• Seksisme: Om iemand onregverdig te behandel net oor hul geslag (seuns en meisies is gelyk onder die Grondwet).\n• As jy mishandel word: Sê ferm NEE → gaan weg → vertel dadelik 'n volwassene wat jy vertrou.\n• Noodnommers: Childline 116 (gratis, 24 uur) | Polisie 10111.", "trick": "Sê NEE, gaan weg, vertel iemand! Childline 116."}, {"id": "m8_fc_5", "mid": "m8", "topic": "Noodhulp: Neusbloeding & Brandwonde", "page": "Bl. 27", "q": "Hoe hanteer jy: (a) 'n Neusbloeding (b) 'n Brandwond?", "a": "(a) Neusbloeding: Sit regop en leun VORENTOE (nie agtertoe nie, anders sluk jy bloed!); knyp die sagte deel van die neus vas vir ±10 minute; asem deur die mond.\n(b) Brandwond: Hou dadelik onder KOEL LOPENDE WATER vir ±20 minute; moenie botter, olie of tandepasta op 'n brandwond sit nie; bedek lossies met 'n skoon doek.", "trick": "Neusbloeding: leun VORENTOE! Brandwond: 20 min koel water, NOOIT botter!"}, {"id": "m8_fc_6", "mid": "m8", "topic": "Verstuite Enkel (R-Y-V-O)", "page": "Bl. 27", "q": "Wat beteken die R-Y-V-O reël vir 'n verstuite enkel?", "a": "**R** - Rus: Moenie op die beseerde voet loop nie.\n**Y** - Ys: Sit ys (toegedraai in 'n lap, nooit direk op die vel nie!) op om swelling te keer.\n**V** - Verband: Draai 'n stewige rekverband om (nie te styf nie).\n**O** - Oplig: Lig die been op sodat dit hoër as die hart rus.", "trick": "R-Y-V-O = Rus, Ys, Verband, Oplig!"}, {"id": "m8_fc_7", "mid": "m8", "topic": "Voedselhigiëne 4 Reëls", "page": "Bl. 27", "q": "Noem die 4 goue reëls van voedselhigiëne en watter uitbreking was in SA in 2017-2018?", "a": "1. SKOON: Was hande vir minstens 20 sekondes met seep en warm water voor jy aan kos vat.\n2. SKEI: Hou rou vleis weg van gaar kos; gebruik aparte snyplanke.\n3. KOOK: Kook kos deeglik (veral hoender, vleis en eiers).\n4. KOEL: Bêre oorskietkos in die yskas; moenie kos lank buite los nie.\n\nIn 2017–2018 het SA die wêreld se grootste listeriose-uitbreking gehad weens besmette verwerkte vleis (polony).", "trick": "Skoon, Skei, Kook, Koel!"}, {"id": "m8_fc_8", "mid": "m8", "topic": "MIV & VIGS", "page": "Bl. 28", "q": "Waarvoor staan MIV en VIGS, en noem 4 maniere hoe MIV NIE oorgedra kan word nie.", "a": "• MIV = Menslike Immuniteitsgebreksvirus (val die liggaam se witbloedselle aan).\n• VIGS = Verworwe Immuniteitsgebreksindroom (die gevorderde stadium waar immuunstelsel baie swak is).\n• ARV's (antiretrovirale medisyne) help mense met MIV om 'n gesonde lewe te lei.\n\nMIV word NIE oorgedra deur:\n1. Drukkies gee of hande skud\n2. 'n Koppie, bord of eetgerei deel\n3. Saam swem of toiletsitplekke gebruik\n4. Muskietbyte!", "trick": "Drukkies, hande skud en muskietbyte dra NIE MIV oor nie!"}, {"id": "m8_fc_ext_1", "mid": "m8", "topic": "Portuurdruk & Selfbeeld (Kwartaal 1)", "page": "K1 Handboek", "q": "Wat is portuurdruk en hoe sê jy 'NEE' sonder om jou vriende te beledig?", "a": "Portuurdruk is wanneer mense van jou eie ouderdom jou probeer dwing om dinge te doen wat jy weet verkeerd of gevaarlik is.\n\nStrategieë:\n1. Sê ferm en duidelik: 'Nee dankie, ek doen nie sulke dinge nie.'\n2. Stel 'n beter alternatief voor ('Kom ons gaan speel liewer basketbal').\n3. Stap eenvoudig weg na ware vriende wat jou grense respekteer.", "trick": "Ware vriende respekteer jou keuses!"}, {"id": "m8_fc_ext_2", "mid": "m8", "topic": "Nasionale Simbole & Vakansiedae (Kwartaal 3)", "page": "Bl. 26", "q": "Wat vier ons op Erfenisdag (24 September) en Jeugdag (16 Junie)?", "a": "• ERFENISDAG (24 September): Ons vier al die ryk en uiteenlopende kulture, tale, kosse en tradisies van al Suid-Afrika se mense (Reënboognasie!).\n• JEUGDAG (16 Junie): Herdenk die dapper skoliere van Soweto in 1976 wat opgestaan het vir gelyke onderwys.", "trick": "16 Junie = Jeugdag. 24 September = Erfenisdag."}, {"id": "m8_fc_ext_3", "mid": "m8", "topic": "Voedselhigiëne (Kwartaal 4)", "page": "Bl. 28", "q": "Wat is die 4 goue reëls van voedselhigiëne om voedselvergiftiging te voorkom?", "a": "1. SKOONMAAK: Was hande, messe en snyplanke deeglik met seep en warm water.\n2. SKEI: Hou rou vleis ALTYD weg van gaar kos en groente.\n3. KOOK: Kook vleis en hoender deeglik gaar sodat kieme doodgaan.\n4. VERKOEL: Sit oorskietkos dadelik in die yskas (onder 5°C).", "trick": "Die 4 goue reëls: Skoonmaak, Skei, Kook, Verkoel!"}];
const quizzes = {"m1": [{"id": "q1_1", "sub": "Demokrasie in SA", "q": "Wat beteken die Griekse woord 'demos' waarvan demokrasie afgelei is?", "options": ["Die koning", "Die mense", "Die howe", "Die wette"], "answer": 1, "expl": "Demokrasie kom van demos (die mense) + kratos (mag/gesag) = regering deur die mense (Bl. 144)."}, {"id": "q1_2", "sub": "Regering & Parlement", "q": "Watter arm van die regering maak en verander wette?", "options": ["Die Uitvoerende gesag (President)", "Die Regsprekende gesag (Howe)", "Die Wetgewende gesag (Parlement)", "Die Munisipaliteit"], "answer": 2, "expl": "Die Wetgewende gesag (Parlement in Kaapstad) MAAK wette. Die onthou-truuk is: MAAK (Parlement) - DOEN (President) - BEOORDEEL (Howe) (Bl. 144)."}, {"id": "q1_3", "sub": "Grondwet", "q": "Watter hof in Suid-Afrika is die hoogste hof en die 'wag' oor die Grondwet?", "options": ["Die Landdroshof", "Die Hoë Hof", "Die Hoogste Hof van Appèl", "Die Konstitusionele Hof"], "answer": 3, "expl": "Die Konstitusionele Hof in Johannesburg is die heel hoogste hof en beskerm die Grondwet (Bl. 146, 150)."}, {"id": "q1_4", "sub": "Parlement", "q": "Hoeveel lede het die Nasionale Vergadering (NV) en die NRVP onderskeidelik?", "options": ["200 en 50", "400 en 90", "350 en 100", "500 en 90"], "answer": 1, "expl": "Die NV het 400 lede en die NRVP het 90 lede (presies 10 uit elk van die 9 provinsies) (Bl. 148)."}, {"id": "q1_5", "sub": "Nasionale Simbole", "q": "Wat is Suid-Afrika se nasionale voël en nasionale boom?", "options": ["Visarend en Maroelakboom", "Bloukraanvoël en Opregte Geelhout", "Sekretarisvoël en Kremetartboom", "Flamink en Jacarandaboom"], "answer": 1, "expl": "Rympie: 'Springende Bloukrane Kyk Geel Galjoene' -> Voël = Bloukraanvoël, Boom = Opregte Geelhout (Bl. 166)."}, {"id": "q1_6", "sub": "Inheemse Medisyne", "q": "Wat is die rol van 'n inyanga in tradisionele Afrika-genesing?", "options": ["Hy kommunikeer met voorouers as waarsêer", "Hy is 'n kruiedokter wat met plante, bas en wortels werk", "Hy doen hartoperasies in hospitale", "Hy maak wette in die Parlement"], "answer": 1, "expl": "'n Inyanga is 'n kruiedokter wat fisiese kwale met plante behandel; 'n sangoma kommunikeer met die voorouers (Bl. 174)."}, {"id": "q1_7", "sub": "Mediese Geskiedenis", "q": "Waarvan is die Engelse woord 'vaccine' (entstof) afgelei?", "options": ["Van die Latynse woord 'vacca' wat koei beteken", "Van die wetenskaplike Louis Pasteur se van", "Van die Griekse woord vir naald", "Van die hospitaal in Londen"], "answer": 0, "expl": "Edward Jenner het koeipokke gebruik om pokke te keer. Die Latynse woord vir koei is vacca, vandaar vaccine (Bl. 182)!"}, {"id": "q1_8", "sub": "Antibiotika", "q": "STRIKVRAAG: Waarteen werk antibiotika soos penisillien?", "options": ["Teen virusse soos griep en verkoue", "Teen slegs bakterieë", "Teen alle siektes insluitend suikersiekte", "Teen hoofpyn en moegheid"], "answer": 1, "expl": "STRIKVRAAG: Antibiotika werk SLEGS teen bakterieë – NIE teen virusse nie! (Bl. 184)."}, {"id": "q1_9", "sub": "Chirurgie & Deurbrake", "q": "Watter antiseptiese middel het Joseph Lister in 1867 gebruik om instrumente en wonde skoon te maak?", "options": ["Soutwater", "Karbolsuur", "Boegoe-asyn", "Chloroform"], "answer": 1, "expl": "Joseph Lister het karbolsuur gebruik as antiseptiese middel om kieme dood te maak (Bl. 185)."}, {"id": "q1_10", "sub": "Hartoorplanting", "q": "Wie was die pasiënt wat op 3 Desember 1967 die wêreld se eerste menslike hartoorplanting ontvang het?", "options": ["Denise Darvall", "Louis Washkansky", "Hamilton Naki", "Philip Blaiberg"], "answer": 1, "expl": "Louis Washkansky was die ontvanger; Denise Darvall was die skenker; Chris Barnard was die chirurg by Groote Schuur (Bl. 186)."}, {"id": "m1_q_ext_1", "sub": "Mapungubwe", "q": "Watter beroemde goue voorwerp is in 1932 by Mapungubwe uitgegrawe?", "options": ["'n Goue kroon", "'n Goue renoster", "'n Goue leeu", "'n Goue spies"], "answer": 1, "expl": "Die Goue Renoster van Mapungubwe is 'n nasionale simbool van leierskap en rykdom in vroeë Suid-Afrikaanse geskiedenis!"}, {"id": "m1_q_ext_2", "sub": "Ontdekkingsreise", "q": "Watter instrument het seevaarders gebruik om te weet waar noord, suid, oos en wes is?", "options": ["'n Gradeboog", "'n Magnetiese kompas", "'n Mikroskoop", "'n Horlosie"], "answer": 1, "expl": "Die magnetiese kompas het die seevaarders gehelp om op oop see koers te hou!"}, {"id": "m1_q_ext_3", "sub": "Medisyne", "q": "Wie het die heel eerste suksesvolle menslike hartoorplanting in 1967 in Kaapstad uitgevoer?", "options": ["Dr. Louis Pasteur", "Dr. Alexander Fleming", "Prof. Chris Barnard", "Dr. Edward Jenner"], "answer": 2, "expl": "Prof. Chris Barnard het wêreldgeskiedenis gemaak in Groote Schuur-hospitaal op 3 Desember 1967!"}], "m2": [{"id": "q2_1", "sub": "Persentasies", "q": "Wat is 30% van R250?", "options": ["R25", "R50", "R75", "R100"], "answer": 2, "expl": "10% van R250 = R25. Dus is 30% = R25 × 3 = R75 (Bl. 8)."}, {"id": "q2_2", "sub": "Lengte Omskakeling", "q": "Skakel 4,2 km om na meter:", "options": ["42 m", "420 m", "4 200 m", "42 000 m"], "answer": 2, "expl": "1 km = 1 000 m. Dus 4,2 × 1 000 = 4 200 m (Bl. 8)."}, {"id": "q2_3", "sub": "3D-Voorwerpe", "q": "Hoeveel vlakke, rande en hoekpunte het 'n driehoekige prisma?", "options": ["5 vlakke, 9 rande, 6 hoekpunte", "6 vlakke, 12 rande, 8 hoekpunte", "4 vlakke, 6 rande, 4 hoekpunte", "5 vlakke, 8 rande, 5 hoekpunte"], "answer": 0, "expl": "'n Driehoekige prisma (soos 'n Toblerone-boks) het 5 vlakke (2 driehoeke + 3 reghoeke), 9 rande en 6 hoekpunte (Bl. 9)."}, {"id": "q2_4", "sub": "Vierhoeke", "q": "Watter vierhoek het net EEN paar ewewydige sye?", "options": ["Parallelogram", "Ruit", "Trapesium", "Reghoek"], "answer": 2, "expl": "'n Trapesium het presies net een paar ewewydige sye (Bl. 9)."}, {"id": "q2_5", "sub": "Omtrek & Oppervlakte", "q": "'n Reghoek is 8 m lank en 5 m breed. Wat is sy omtrek en oppervlakte?", "options": ["Omtrek = 26 m, Oppervlakte = 40 m²", "Omtrek = 40 m, Oppervlakte = 26 m²", "Omtrek = 13 m, Oppervlakte = 40 m", "Omtrek = 26 m², Oppervlakte = 40 m³"], "answer": 0, "expl": "Omtrek = 2 × (8 + 5) = 26 m. Oppervlakte = 8 × 5 = 40 m² (onthou eenhede tel punte!) (Bl. 10)."}, {"id": "q2_6", "sub": "Kapasiteit", "q": "Hoeveel milliliter is daar in 1,75 liter?", "options": ["175 ml", "1 750 ml", "17 500 ml", "17,5 ml"], "answer": 1, "expl": "1 liter = 1 000 ml. Dus 1,75 × 1 000 = 1 750 ml (Bl. 10)."}, {"id": "q2_7", "sub": "Tyd & Tydsverloop", "q": "Die rugbywedstryd begin om 14:40 en duur 1 uur en 25 minute. Hoe laat blaas die eindfluitjie?", "options": ["15:05", "16:05", "15:55", "16:15"], "answer": 1, "expl": "14:40 + 20 min = 15:00. Nog 1 uur en 5 min oor -> 15:00 + 1 h 5 min = 16:05 (Bl. 10)."}, {"id": "q2_8", "sub": "Datahantering", "q": "Vind die mediaan van die volgende getalle: 12, 8, 15, 8, 10", "options": ["8", "10", "12", "15"], "answer": 1, "expl": "Sorteer eers: 8, 8, 10, 12, 15. Die middelste getal is 10 (Bl. 11)."}, {"id": "q2_9", "sub": "Hoeke & Driehoeke", "q": "Twee binnehoeke van 'n driehoek is 50° en 70°. Hoe groot is die derde hoek?", "options": ["50°", "60°", "70°", "180°"], "answer": 1, "expl": "Die hoeke van enige driehoek tel op tot 180°. 50° + 70° = 120°. Derde hoek = 180° − 120° = 60° (Bl. 8)."}, {"id": "q2_10", "sub": "Transformasies", "q": "Watter transformasie skuif 'n figuur sonder om sy vorm, grootte of rigting te verander?", "options": ["Rotasie", "Refleksie", "Translasie", "Tessellasie"], "answer": 2, "expl": "Translasie is 'n reguit skuif of gly (Bl. 9)."}, {"id": "m2_q_ext_1", "sub": "Breuke", "q": "Bereken: 1/2 + 1/4 (Wenk: maak noemers eers dieselfde!)", "options": ["2/6", "3/4", "2/4", "1/6"], "answer": 1, "expl": "1/2 is dieselfde as 2/4. Nou tel ons op: 2/4 + 1/4 = 3/4!"}, {"id": "m2_q_ext_2", "sub": "Persentasies", "q": "Wat is 25% van R200?", "options": ["R25", "R40", "R50", "R100"], "answer": 2, "expl": "25% is 'n kwart (deel deur 4). R200 ÷ 4 = R50!"}, {"id": "m2_q_ext_3", "sub": "Tyd", "q": "'n Fliek begin om 14:15 en duur 1 uur en 50 minute. Hoe laat eindig die fliek?", "options": ["15:05", "15:55", "16:05", "16:15"], "answer": 2, "expl": "14:15 + 1 uur = 15:15. Voeg 50 min by: 15:15 + 45 min = 16:00, plus nog 5 min = 16:05!"}, {"id": "m2_q_ext_4", "sub": "Datahantering", "q": "Vind die mediaan van: 3, 9, 2, 7, 5", "options": ["3", "5", "7", "9"], "answer": 1, "expl": "Rangskik eers van klein na groot: 2, 3, 5, 7, 9. Die middelste getal is 5!"}], "m3": [{"id": "q3_1", "sub": "Trappe van Vergelyking", "q": "Wat is die trappe van vergelyking vir 'hoog'?", "options": ["hoog - hooger - hoogste", "hoog - hoër - hoogste", "hoog - hoeder - hoogste", "hoog - meer hoog - mees hoog"], "answer": 1, "expl": "Die g val weg en kry 'n deelteken: hoog - hoër - hoogste (Bl. 200)."}, {"id": "q3_2", "sub": "Intensiewe Vorme", "q": "Wat is die intensiewe vorm van 'baie oud' en 'baie nat'?", "options": ["stokoud en sopnat", "stok-oud en sop nat", "oeroud en waternat", "kraakoud en druipnat"], "answer": 0, "expl": "stokoud en sopnat, altyd as EEN woord geskryf sonder koppeltekens of spasies (Bl. 200)."}, {"id": "q3_3", "sub": "Verlede Tyd", "q": "Skryf die sin in die verlede tyd: 'Ons vergeet die boeke by die huis.'", "options": ["Ons het die boeke by die huis gevergeet.", "Ons het die boeke by die huis vergeet.", "Ons sal die boeke by die huis vergeet.", "Ons was die boeke by die huis vergeet."], "answer": 1, "expl": "Reël: BE-GE-ER-HER-ONT-VER kry GEEN ge- in die verlede tyd nie! Dus: Ons het die boeke by die huis vergeet (Bl. 200)."}, {"id": "q3_4", "sub": "Voegwoorde", "q": "Verbind die twee sinne met 'omdat': 'Hy is laat. Hy het die bus gemis.'", "options": ["Hy is laat omdat hy die bus gemis het.", "Hy is laat omdat het hy die bus gemis.", "Hy is laat omdat hy het die bus gemis.", "Omdat hy laat is, hy het die bus gemis."], "answer": 0, "expl": "Omdat is 'n Groep 3-voegwoord: die werkwoord ('het') skuif heel stert-toe na die einde van die sin (Bl. 21)."}, {"id": "q3_5", "sub": "Voorsetsels", "q": "Kies die korrekte vaste voorsetsel: 'Die kaptein is baie trots ___ sy span.'", "options": ["vir", "op", "oor", "met"], "answer": 1, "expl": "Die vaste voorsetsel is trots OP (Bl. 93)."}, {"id": "q3_6", "sub": "Sinsoorte", "q": "Watter soort sin is: 'Wat 'n ongelooflike verrassing!'", "options": ["Stelsin", "Vraagsin", "Bevelsin", "Uitroepsin"], "answer": 3, "expl": "Dit wys sterk gevoel/emosie en eindig op 'n uitroepteken: Uitroepsin (Bl. 33)."}, {"id": "q3_7", "sub": "Skryftekens Strikvraag", "q": "STRIKVRAAG: Watter sin is KORREK geskryf?", "options": ["'N Hond blaf in die straat.", "'n Hond blaf in die straat.", "'n hond blaf in die straat.", "'N hond blaf in die straat."], "answer": 1, "expl": "'n kry NOOIT 'n hoofletter nie; die VOLGENDE woord ('Hond') kry die hoofletter (Bl. 45)!"}, {"id": "q3_8", "sub": "Bywoorde T-M-P", "q": "Wat is die korrekte woordorde vir bywoorde in 'n Afrikaanse sin?", "options": ["Plek voor Manier voor Tyd (P-M-T)", "Manier voor Tyd voor Plek (M-T-P)", "Tyd voor Manier voor Plek (T-M-P)", "Tyd voor Plek voor Manier (T-P-M)"], "answer": 2, "expl": "Die T-M-P reël: Tyd kom voor Manier, wat voor Plek kom (Bl. 68, 201)."}, {"id": "q3_9", "sub": "Antonieme", "q": "Wat is die antoniem van 'dapper'?", "options": ["kwaad", "bang / lafhartig", "moeg", "swak"], "answer": 1, "expl": "Die teenoorgestelde van dapper is lafhartig of bang (Bl. 139)."}, {"id": "q3_10", "sub": "Voegwoorde Groep 2", "q": "Verbind met 'daarom': 'Dit reën. Ons bly binne.'", "options": ["Dit reën, daarom ons bly binne.", "Dit reën, daarom bly ons binne.", "Dit reën, daarom ons binne bly.", "Daarom dit reën, bly ons binne."], "answer": 1, "expl": "Daarom is Groep 2: die werkwoord ('bly') kom DIREK NÁ die voegwoord (Bl. 21)."}, {"id": "m3_q_ext_1", "sub": "Lydende Vorm", "q": "Wat is die lydende vorm van: 'Shenique lees 'n boek'?", "options": ["'n Boek lees Shenique.", "'n Boek het deur Shenique gelees.", "'n Boek word deur Shenique gelees.", "'n Boek sal deur Shenique gelees word."], "answer": 2, "expl": "Teenwoordige tyd in die lydende vorm gebruik 'word ... deur ... gelees'!"}, {"id": "m3_q_ext_2", "sub": "Ontkenning", "q": "Skryf in die ontkenning: 'Hy het al iets geëet.'", "options": ["Hy het nie iets geëet nie.", "Hy het nog niks geëet nie.", "Hy het nooit geëet nie.", "Niemand het geëet nie."], "answer": 1, "expl": "'Al iets' verander na 'nog niks ... nie'!"}], "m4": [{"id": "q4_1", "sub": "Pronouns", "q": "Choose the correct possessive pronoun: 'The red bicycle is ______.'", "options": ["her's", "hers", "hers'", "she's"], "answer": 1, "expl": "Possessive pronouns never take an apostrophe: hers, yours, theirs, ours (p. 137)."}, {"id": "q4_2", "sub": "Demonstratives", "q": "In the sentence 'These apples are sweet', what part of speech is 'These'?", "options": ["Demonstrative pronoun", "Demonstrative adjective", "Proper noun", "Adverb"], "answer": 1, "expl": "Because 'these' stands directly in front of the noun 'apples', it is a demonstrative adjective (p. 158)."}, {"id": "q4_3", "sub": "Reported Speech", "q": "Change to indirect speech: 'I can swim,' said Ayanda.", "options": ["Ayanda said that I can swim.", "Ayanda said that she could swim.", "Ayanda said that she can swim.", "Ayanda said that she will swim."], "answer": 1, "expl": "Pronoun changes (I -> she) and tense moves one step back (can -> could) (Term 3 notes)."}, {"id": "q4_4", "sub": "Passive Voice", "q": "Change to passive voice: 'The wind broke the window.'", "options": ["The window is broken by the wind.", "The window was broken by the wind.", "The window had broken by the wind.", "The window broke by the wind."], "answer": 1, "expl": "Broke is past tense -> was broken by the wind (Term 3 notes)."}, {"id": "q4_5", "sub": "Clauses", "q": "In 'Although it was cold, we went swimming', which is the subordinate clause?", "options": ["we went swimming", "Although it was cold", "it was cold", "went swimming"], "answer": 1, "expl": "'Although it was cold' starts with a subordinating conjunction and cannot stand alone (Term 4 notes)."}, {"id": "q4_6", "sub": "Adverbs", "q": "Identify the adverb of frequency: 'She always sings happily.'", "options": ["sings", "happily", "always", "she"], "answer": 2, "expl": "'always' tells how often (frequency); 'happily' is an adverb of manner (Term 3 notes)."}, {"id": "q4_7", "sub": "Conjunctions", "q": "Which of these is a coordinating conjunction from FANBOYS?", "options": ["because", "although", "so", "unless"], "answer": 2, "expl": "FANBOYS: For, And, Nor, But, Or, Yet, So (Term 1 notes)."}, {"id": "q4_8", "sub": "Punctuation", "q": "Which sentence has correct punctuation for direct speech?", "options": ["\"Let's go\", said Lebo.", "\"Let's go,\" said Lebo.", "\"Let's go said Lebo.\"", "\"lets go,\" said lebo."], "answer": 1, "expl": "Comma goes inside the closing quotation marks: \"Let's go,\" said Lebo (Term 3 notes)."}, {"id": "m4_q_ext_1", "sub": "Pronouns", "q": "Choose the correct word: 'Can you see _____ birds flying far away?'", "options": ["this", "that", "these", "those"], "answer": 3, "expl": "'Birds' is plural and they are 'far away', so we use 'those'!"}, {"id": "m4_q_ext_2", "sub": "Passive Voice", "q": "Change to passive voice: 'The dog chewed the bone.'", "options": ["The bone chewed the dog.", "The bone was chewed by the dog.", "The bone is chewed by the dog.", "The dog was chewing the bone."], "answer": 1, "expl": "The sentence was in past tense ('chewed'), so passive uses 'was chewed by'!"}], "m5": [{"id": "q5_1", "sub": "Weer vs Klimaat", "q": "Wat is klimaat?", "options": ["Die temperatuur en reënval van vandag", "Die gemiddelde weerstoestande oor 'n tydperk van sowat 30 jaar", "Hoeveel dit in die somer reën", "Die voorspelling vir môre op TV"], "answer": 1, "expl": "Klimaat is die gemiddelde weerstoestande gemeet oor 'n lang tydperk van ongeveer 30 jaar (Bl. 50)."}, {"id": "q5_2", "sub": "Reënwoud Lae", "q": "In watter laag van die reënwoud leef die meeste diere soos ape, toekans en luiaards?", "options": ["Die woudvloer", "Die ondergroei", "Die blaredak (kroondak)", "Die opkomende laag"], "answer": 2, "expl": "Die blaredak (kroondak / canopy) vorm 'n digte groen dak waar die meeste diere kos en skuiling kry (Bl. 57)."}, {"id": "q5_3", "sub": "Woestyne", "q": "Wat is die grootste woestyn op die aarde?", "options": ["Die Sahara", "Die Kalahari", "Antarktika", "Die Namib"], "answer": 2, "expl": "Antarktika is 'n koue woestyn en is die grootste woestyn op aarde. Die Sahara is die grootste WARM woestyn (Bl. 60)."}, {"id": "q5_4", "sub": "Plant-aanpassings", "q": "Waarom is die bome in naaldwoude keëlvormig?", "options": ["Om meer sonlig te vang", "Sodat sneeu maklik van die takke kan afgly en nie takke breek nie", "Om voëls te lok", "Sodat hulle vinniger kan groei"], "answer": 1, "expl": "Hul keëlvorm laat sneeu afgly sodat swaar sneeu nie hul takke afbreek nie (Bl. 67)."}, {"id": "q5_5", "sub": "Provinsies van SA", "q": "Watter provinsie in Suid-Afrika is die kleinste in oppervlakte, maar het die meeste inwoners?", "options": ["Wes-Kaap", "KwaZulu-Natal", "Gauteng", "Mpumalanga"], "answer": 2, "expl": "Die Groot Paradoks: Gauteng is die kleinste provinsie maar het die meeste mense (15,1 miljoen) (Bl. 76, 79)."}, {"id": "q5_6", "sub": "Bevolkingsdigtheid", "q": "Bereken die bevolkingsdigtheid van 'n streek van 200 km² met 10 000 mense:", "options": ["20 mense per km²", "50 mense per km²", "200 mense per km²", "500 mense per km²"], "answer": 1, "expl": "10 000 mense ÷ 200 km² = 50 mense per km² (Bl. 80)."}, {"id": "q5_7", "sub": "Trek- en Stootfaktore", "q": "Watter van die volgende is 'n STOOTFAKTOR wat mense laat weggaan van 'n plek?", "options": ["Baie werksgeleenthede", "Goeie skole en hospitale", "Ernstige droogte en werkloosheid", "Vrugbare grond vir boerdery"], "answer": 2, "expl": "Stootfaktore stoot mense weg, soos droogte, werkloosheid, misdaad en armoede (Bl. 82)."}, {"id": "q5_8", "sub": "Wêreldbevolking", "q": "Watter kontinent het die grootste bevolking ter wêreld?", "options": ["Afrika", "Europa", "Asië", "Noord-Amerika"], "answer": 2, "expl": "Asië het verreweg die meeste mense, met reuse lande soos Indië en China (Bl. 90)."}, {"id": "m5_q_ext_1", "sub": "Kaartvaardighede", "q": "Wat noem ons die 0°-breedtegraadlyn wat die aarde in die Noordelike en Suidelike Halfrond verdeel?", "options": ["Die Keerkring van Kreef", "Die Ewenaar", "Die Nulmeridiaan", "Die Suidpool"], "answer": 1, "expl": "Die Ewenaar lê op presies 0° breedtegraad en verdeel die aarde in die noordelike en suidelike helftes!"}, {"id": "m5_q_ext_2", "sub": "Handel", "q": "As Suid-Afrika ru-ystererts na China verkoop, is dit 'n voorbeeld van:", "options": ["Invoer van vervaardigde goedere", "Uitvoer van primêre produkte", "Binnelandse handel", "Sluikhandel"], "answer": 1, "expl": "Ystererts is 'n onverwerkte rou materiaal (primêr) wat ons aan 'n ander land verkoop (uitvoer)!"}], "m6": [{"id": "q6_1", "sub": "Optelling", "q": "Bereken: 456 789 + 123 456", "options": ["579 145", "580 245", "570 245", "580 145"], "answer": 1, "expl": "456 789 + 123 456 = 580 245 (Bl. 21, 22)."}, {"id": "q6_2", "sub": "Aftrekking", "q": "Bereken: 700 000 − 238 457", "options": ["461 543", "462 543", "561 543", "471 543"], "answer": 0, "expl": "Leen oor die nulle: 700 000 − 238 457 = 461 543. Toets: 461 543 + 238 457 = 700 000 (Bl. 21, 22)."}, {"id": "q6_3", "sub": "Afronding", "q": "Rond 78 549 af tot die naaste 1 000:", "options": ["78 000", "78 500", "79 000", "80 000"], "answer": 2, "expl": "Die honderdesyfer is 5, dus spring die duisende op van 78 na 79: 79 000 (Bl. 21, 22)."}, {"id": "q6_4", "sub": "Priemgetalle", "q": "Watter van die volgende is 'n priemgetal?", "options": ["21", "27", "29", "35"], "answer": 2, "expl": "21 = 3×7; 27 = 3×9; 35 = 5×7. 29 het slegs twee faktore: 1 en 29 (Bl. 22)."}, {"id": "q6_5", "sub": "Deelbaarheid", "q": "Is die getal 5 832 deelbaar deur 9?", "options": ["Nee, want dit eindig op 2", "Ja, want 5 + 8 + 3 + 2 = 18 en 18 is deelbaar deur 9", "Nee, want dit is 'n ewe getal", "Ja, want dit begin met 5"], "answer": 1, "expl": "Deelbaarheidsreël vir 9: die som van die syfers is 18, wat presies deelbaar is deur 9 (Bl. 22)."}, {"id": "q6_6", "sub": "Deling & Res", "q": "Bereken: 6 480 ÷ 15", "options": ["432", "422", "442", "412"], "answer": 0, "expl": "64 ÷ 15 = 4 (res 4) -> 48 ÷ 15 = 3 (res 3) -> 30 ÷ 15 = 2. Antwoord: 432 (Bl. 22)."}, {"id": "q6_7", "sub": "Hoofrekene", "q": "Bereken met 'n vinnige truuk: 25 × 12", "options": ["250", "300", "350", "400"], "answer": 1, "expl": "25 × 4 = 100. Omdat 12 = 4 × 3, is 25 × 12 = 100 × 3 = 300 (Bl. 22)!"}, {"id": "q6_8", "sub": "BODMAS", "q": "Wat is die waarde van: 10 + 5 × 4 − 6?", "options": ["54", "24", "30", "14"], "answer": 1, "expl": "BODMAS: Maal eers: 5 × 4 = 20. Dan van links na regs: 10 + 20 = 30, en 30 − 6 = 24 (Bl. 22)."}, {"id": "m6_q_ext_1", "sub": "Plekwaarde", "q": "Wat is die WAARDE van die onderstreepte syfer in 3 4_5_2 890?", "options": ["Vyf", "Vyftig", "Vyfduisend", "Vyftigduisend"], "answer": 3, "expl": "Die 5 sit in die Tienduisende-kolom (TD), so sy waarde is 50 000 (vyftigduisend)!"}, {"id": "m6_q_ext_2", "sub": "Afronding", "q": "Rond 8 449 af tot die naaste duisend:", "options": ["8 000", "8 400", "8 500", "9 000"], "answer": 0, "expl": "Die honderde-syfer regs van die duisende is 4 (4 of laer gly af), so dit rond af na 8 000!"}, {"id": "m6_q_ext_3", "sub": "Deelbaarheid", "q": "Watter van hierdie getalle is deelbaar deur 3?", "options": ["124", "235", "342", "415"], "answer": 2, "expl": "Tel die syfers van 342 bymekaar: 3 + 4 + 2 = 9. Omdat 9 in die 3-tafel is, deel 342 perfek deur 3!"}], "m7": [{"id": "q7_1", "sub": "Elektriese Stroombane", "q": "Wat gebeur in 'n oop stroombaan?", "options": ["Die gloeilamp brand helderder", "Daar is 'n gaping en geen stroom kan vloei nie", "Die battery laai vinniger op", "Die drade word dadelik warm"], "answer": 1, "expl": "In 'n oop stroombaan is daar 'n gaping (bv. oop skakelaar of los draad) wat keer dat stroom vloei (Bl. 23)."}, {"id": "q7_2", "sub": "Stroombaansimbole", "q": "In die simbool vir 'n elektriese sel, wat stel die lang, dun lyn voor?", "options": ["Die negatiewe (−) pool", "Die skakelaar", "Die positiewe (+) pool", "Die gloeilampie"], "answer": 2, "expl": "Die lang, dun lyn is die positiewe (+) pool; die kort, dik lyn is die negatiewe (−) pool (Bl. 23)."}, {"id": "q7_3", "sub": "Geleiers en Isoleerders", "q": "Watter van die volgende materiale is 'n elektriese geleier?", "options": ["Plastiek liniaal", "Grafiet (potloodlood)", "Rubber uitveër", "Glasbottel"], "answer": 1, "expl": "Grafiet is 'n vorm van koolstof wat elektrisiteit baie goed gelei! (Bl. 23)."}, {"id": "q7_4", "sub": "Kragstasies", "q": "Wat laat die turbine in 'n steenkoolkragstasie draai om die generator aan te dryf?", "options": ["Die rook van die steenkool", "Hoëdruk stoom van kokende water", "Koue rivierwater", "Elektrisiteit uit batterye"], "answer": 1, "expl": "Die hitte van brandende steenkool kook water om hoëdruk stoom te maak wat die turbines laat tol (Bl. 24)."}, {"id": "q7_5", "sub": "Sonnestelsel", "q": "Watter planeet is die warmste planeet in ons sonnestelsel?", "options": ["Mercurius (naaste aan die son)", "Venus (weens dik atmosfeer)", "Mars", "Jupiter"], "answer": 1, "expl": "Al is Mercurius nader, is VENUS die warmste planeet omdat sy dik CO2-atmosfeer al die sonhitte soos 'n oond vashou (Bl. 24)."}, {"id": "q7_6", "sub": "Aarde Bewegings", "q": "Wat veroorsaak dag en nag op aarde?", "options": ["Die Aarde wat om die Son wentel in 365 dae", "Die Aarde wat om sy eie as roteer elke 24 uur", "Die Maan wat voor die Son inskuif", "Die wolke wat die Son toemaak"], "answer": 1, "expl": "Die Aarde roteer (draai om eie as) een keer elke 24 uur; die kant wat na die son kyk het dag (Bl. 24)."}, {"id": "q7_7", "sub": "Teleskope in SA", "q": "Waar in Suid-Afrika is die reuse optiese teleskoop SALT geleë?", "options": ["Kaapstad", "Pretoria", "Sutherland in die Noord-Kaap", "Durban"], "answer": 2, "expl": "SALT is by Sutherland in die Noord-Kaap gebou weens die donker, skoon lug sonder ligbesoedeling (Bl. 25)."}, {"id": "q7_8", "sub": "Mars Verkenning", "q": "Hoeveel mense het tot vandag toe al op die planeet Mars geloop?", "options": ["12 mense", "2 mense", "Nog nie een mens nie, slegs robotte", "6 ruimtevaarders"], "answer": 2, "expl": "Nog geen mens was op Mars nie – slegs 12 mense was op die Maan. Op Mars het slegs robot-rovers geland! (Bl. 25)."}, {"id": "m7_q_ext_1", "sub": "Fotosintese", "q": "Watter lewensnoodsaaklike gas stel plante tydens fotosintese vry?", "options": ["Koolstofdioksied", "Stikstof", "Suurstof", "Metangas"], "answer": 2, "expl": "Plante neem koolstofdioksied in en stel suurstof vry wat mense en diere nodig het om te lewe!"}, {"id": "m7_q_ext_2", "sub": "Sonnestelsel", "q": "Hoe lank neem dit die Aarde om een keer om sy eie as te roteer?", "options": ["12 uur", "24 uur (1 dag)", "28 dae", "365 dae (1 jaar)"], "answer": 1, "expl": "Die Aarde roteer een keer elke 24 uur om sy eie as, wat dag en nag veroorsaak!"}], "m8": [{"id": "q8_1", "sub": "Vakansiedae", "q": "Wat vier Suid-Afrikaners op 27 April elke jaar?", "options": ["Menseregtedag", "Vryheidsdag (eerste demokratiese verkiesing in 1994)", "Erfenisdag", "Jeugdag"], "answer": 1, "expl": "27 April is Vryheidsdag ter herdenking van ons heel eerste demokratiese verkiesing in 1994 (Bl. 26)."}, {"id": "q8_2", "sub": "Mishandeling", "q": "Wat is die gratis 24-uur noodnommer vir Childline in Suid-Afrika?", "options": ["10111", "10177", "116", "112"], "answer": 2, "expl": "Childline se gratis tolvrye noodnommer is 116 (Bl. 26)."}, {"id": "q8_3", "sub": "Noodhulp", "q": "Wat moet jy doen as iemand 'n neusbloeding het?", "options": ["Leun agtertoe en drink koue water", "Sit regop, leun VORENTOE en knyp die sagte deel van die neus vas", "Bly plat op jou rug lê", "Sit dadelik botter op die neus"], "answer": 1, "expl": "Leun altyd VORENTOE sodat die bloed nie in die keel afloop nie, en knyp die sagte deel vir ±10 min vas (Bl. 27)."}, {"id": "q8_4", "sub": "Brandwonde", "q": "Wat is die regte behandeling vir 'n brandwond?", "options": ["Smeer dadelik botter of olie aan", "Hou dit onder koel lopende water vir ±20 minute", "Vryf dit hard met ys", "Smeer tandepasta daaroor"], "answer": 1, "expl": "Hou dit dadelik onder koel lopende water vir minstens 20 minute. Moet NOOIT botter, olie of tandepasta aansmeer nie! (Bl. 27)."}, {"id": "q8_5", "sub": "Verstuite Enkel", "q": "Wat beteken die letter 'Y' in die R-Y-V-O reël?", "options": ["Yster drink", "Ys aansit (toegedraai in 'n lap)", "Yl verbande aansit", "Ywerig aanstap"], "answer": 1, "expl": "R-Y-V-O = Rus, Ys (in 'n lap), Verband, Oplig bo die hart (Bl. 27)."}, {"id": "q8_6", "sub": "Voedselhigiëne", "q": "Vir hoe lank moet jy jou hande met seep en warm water was volgens die reëls van voedselhigiëne?", "options": ["Minstens 5 sekondes", "Minstens 20 sekondes (sing Veels geluk 2 keer)", "Minstens 2 minute", "Net vinnig afspoel"], "answer": 1, "expl": "Was hande vir minstens 20 sekondes met seep (sing 'Veels geluk' twee keer!) (Bl. 27)."}, {"id": "q8_7", "sub": "MIV en VIGS", "q": "Kan jy MIV kry as 'n muskiet jou byt nadat hy iemand met MIV gebyt het?", "options": ["Ja, muskiete dra altyd MIV oor", "Nee, MIV kan glad nie deur muskietbyte oorgedra word nie", "Slegs in die somer", "Ja, as dit 'n malariamuskiet is"], "answer": 1, "expl": "MIV kan NIE deur muskietbyte oorgedra word nie – dit is 'n mite! (Bl. 28)."}, {"id": "q8_8", "sub": "Nasiebou", "q": "Hoeveel amptelike tale het Suid-Afrika?", "options": ["11 tale", "12 tale (insluitend Gebaretaal)", "9 tale", "14 tale"], "answer": 1, "expl": "Suid-Afrika het 12 amptelike tale sedert Gebaretaal in 2023 amptelik bygevoeg is (Bl. 26)."}, {"id": "m8_q_ext_1", "sub": "Vakansiedae", "q": "Watter nasionale vakansiedag vier ons jaarliks op 27 April?", "options": ["Vryheidsdag", "Jeugdag", "Erfenisdag", "Werkersdag"], "answer": 0, "expl": "27 April is VRYHEIDSDAG — die herdenking van Suid-Afrika se eerste demokratiese verkiesing in 1994!"}, {"id": "m8_q_ext_2", "sub": "Noodhulp", "q": "Wat moet jy doen as iemand 'n erge neusbloeding kry?", "options": ["Leun sy kop agteroor en laat hom lê", "Laat hom vorentoe leun en knyp die sagte deel van die neus vir 10 minute vas", "Blaas dadelik sy neus hard uit", "Sit warm water op sy voorkop"], "answer": 1, "expl": "Leun altyd VORENTOE (sodat bloed nie in die keel afloop nie) en knyp die neusbrug stewig vas!"}]};
const klasLessons = [{"id": "les_m1_demokrasie", "mid": "m1", "subject": "SW: Geskiedenis", "title": "Demokrasie & Hoe die Regering Werk", "subtitle": "Parlement, President & Howe — wie maak die wette en wie pas dit toe?", "icon": "🏛️", "concept": "Wat is demokrasie en hoe werk die 3 arms van die Suid-Afrikaanse regering?", "analogy7yo": "Dink aan 'n wedstryd op die speelgrond met 3 leiers:\n1. Die Reëlemakers (Parlement in Kaapstad): Hulle sit saam en besluit die reëls van die spel sodat dit regverdig is.\n2. Die Leier wat die bal skop (President en sy ministers in Pretoria): Hulle voer die spel uit en sorg dat dinge gedoen word.\n3. Die Skeidsregter met die fluitjie (Die Howe en Konstitusionele Hof in Johannesburg): As iemand stry of 'n reël breek, blaas die skeidsregter die fluitjie en beslis wie gelyk het!\nNiemand het AL die mag nie — hulle pas mekaar op!", "methods": [{"title": "Metode 1: Die Geheuetruuk (MAAK - DOEN - BEOORDEEL) 🧠", "desc": "Onthou hierdie 3 werkwoorde:\n• WETGEWEND (Parlement, Kaapstad) = MAAK die wette (400 lede in NV + 90 lede in NRVP).\n• UITVOEREND (President & Kabinet, Pretoria) = DOEN die werk (regeer die land en bou paaie en skole).\n• REGSPREKEND (Howe, Bloemfontein & Johannesburg) = BEOORDEEL of wette gebreek is.\nDie Konstitusionele Hof is die heel hoogste hof in die land en pas die Grondwet op!", "rule": "Rympie: Kaapstad MAAK, Pretoria DOEN, Howe BEOORDEEL!"}, {"title": "Metode 2: Die Geheime Stembus Storie 🗳️", "desc": "• Woord-oorsprong: Demos (die mense) + Kratos (mag/gesag) = Regering deur die mense!\n• Hoe stem ons? Elke Suid-Afrikaner van 18 jaar en ouer kry 'n stembriefie.\n• Agter 'n kartonhokkie maak jy 'n geheime kruisie (X) langs die party van jou keuse.\n• Ons stem NIE direk vir die President nie! Ons stem vir 'n party. Die party met die meeste stemme in die Nasionale Vergadering kies dan die President.", "rule": "STRIKVRAAG: Ons stem vir 'n politieke party, nie direk vir die President nie!"}, {"title": "Metode 3: Die Nasionale Simbole Geheueruim 🇿🇦", "desc": "Gebruik die vrolike rympie:\n'Springende Bloukrane Kyk Geel Galjoene'\n• Dier: Springbok\n• Voël: Bloukraanvoël\n• Blom: Koningsprotea\n• Boom: Opregte Geelhout\n• Vis: Galjoen\nGrondwet van SA: Aanvaar op 8 Mei 1996, amptelik in werking getree op 4 Februarie 1997.", "rule": "Grondwet is die hoogste wet van SA — geen wet mag bo die Grondwet wees nie!"}], "video": {"title": "Witbord-Klas: Die 3 Arms van Regering", "canvasType": "democracy", "steps": [{"step": 1, "drawTitle": "Die Wetgewende Gesag (Parlement)", "text": "Stap 1: Die Parlement in Kaapstad MAAK wette. 400 lede in Nasionale Vergadering + 90 lede in NRVP.", "code": "drawDemocracy(1)"}, {"step": 2, "drawTitle": "Die Uitvoerende Gesag (President)", "text": "Stap 2: Die President en sy Ministers in Pretoria VOER die wette uit en bestuur die land.", "code": "drawDemocracy(2)"}, {"step": 3, "drawTitle": "Die Regsprekende Gesag (Howe)", "text": "Stap 3: Die Konstitusionele Hof in Johannesburg is die waghond wat kyk dat almal die Grondwet gehoorsaam!", "code": "drawDemocracy(3)"}]}, "practice": [{"q": "Watter arm van die regering MAAK en verander die wette van Suid-Afrika?", "options": ["Die Uitvoerende gesag (President)", "Die Wetgewende gesag (Parlement in Kaapstad)", "Die Regsprekende gesag (Howe)", "Die Polisie"], "answer": 1, "expl": "Die Wetgewende gesag (Parlement) MAAK die wette! Onthou: Maak = Parlement."}, {"q": "Wat is Suid-Afrika se nasionale boom en voël?", "options": ["Kremetartboom en Visarend", "Opregte Geelhout en Bloukraanvoël", "Maroelakboom en Sekretarisvoël", "Eikboom en Tarentaal"], "answer": 1, "expl": "Rympie: 'Springende Bloukrane Kyk Geel Galjoene' -> Bloukraanvoël en Geelhout!"}]}, {"id": "les_m1_medisyne", "mid": "m1", "subject": "SW: Geskiedenis", "title": "Mediese Helde: Van Boegoe tot Chris Barnard", "subtitle": "Hoe mense siektes oorwin het — die wonderwêreld van medisyne!", "icon": "🩺", "concept": "Wat is die verskil tussen inheemse en westerse medisyne, en wie was die groot mediese baanbrekers?", "analogy7yo": "Stel voor jou liggaam is 'n kasteel en siektes is klein mikroskopiese diewe wat wil inbreek:\n• Die Inheemse Genesers: Ken die veld se geheime geheime kruie (boegoe, aalwyn, wildedagga) om wonde en maagpyn te sus.\n• Edward Jenner: Sien dat melkmeisies wat koeipokke kry, nooit die dodelike pokke kry nie. 'Vacca' is Latyn vir koei — vandaar die woord 'vaccine' (entstof)!\n• Louis Pasteur: Ontdek dat klein kieme melk laat suur word. As jy dit verhit, gaan die kieme dood (pasteurisasie)!\n• Alexander Fleming: Vergeet 'n petri-bakkie in sy laboratorium. 'n Groen muf groei daarop en maak al die bakterieë dood — vandoor ontdek hy penisillien (antibiotika)!\n• Prof. Chris Barnard: Doen op 3 Desember 1967 in Kaapstad die heel eerste menslike hartoorplanting in die wêreld!", "methods": [{"title": "Metode 1: Inheems vs Westers 🌿", "desc": "• Inheems: Inyanga werk met plante, bas, wortels en minerale (kruiedokter). Sangoma kommunikeer met die voorouers deur beendere te gooi (geestelike geneser).\n• Westers: Wetenskaplik getoets in laboratoriums, kliniese proewe, tablette en inspuitings.", "rule": "Inheems kyk na die hele mens en gees; Westers kyk na die biologiese oorsaak en selle."}, {"title": "Metode 2: Die Strikvraag van Antibiotika ⚠️", "desc": "STRIKVRAAG IN EKSAMEN:\n• Antibiotika (soos penisillien) werk SLEGS teen BAKTERIEË.\n• Dit werk glad NIE teen VIRUSSE (soos griep, verkoue of MIV) nie!\n• As jy griep het, help 'n antibiotika-pil jou niks nie!", "rule": "Antibiotika = SLEGS Bakterieë! Moet nooit virus sê nie!"}, {"title": "Metode 3: Die Tydlyn van Deurbrake ⏳", "desc": "1. Edward Jenner (1796): Eerste entstof (pokke vanaf koeipokke).\n2. Louis Pasteur (1860's): Kiemteorie & pasteurisasie.\n3. Joseph Lister (1867): Karbolsuur om wonde en instrumente skoon te maak (antisepties).\n4. Alexander Fleming (1928): Penisillien (eerste antibiotika).\n5. Chris Barnard (3 Des 1967): Eerste menslike hartoorplanting (Groote Schuur, pasiënt Louis Washkansky).", "rule": "Chris Barnard het geskiedenis gemaak in Groote Schuur-hospitaal, Kaapstad!"}], "video": {"title": "Witbord-Klas: Die Mediese Tydlyn", "canvasType": "medicine", "steps": [{"step": 1, "drawTitle": "Edward Jenner & Koeipokke (1796)", "text": "Jenner gebruik koeipokke om die dodelike pokke te keer. Latyn 'vacca' = koei -> vaccine!", "code": "drawMedicine(1)"}, {"step": 2, "drawTitle": "Alexander Fleming & Penisillien (1928)", "text": "Groen broodmuf maak bakterieë dood! Die eerste wonder-antibiotika is gebore.", "code": "drawMedicine(2)"}, {"step": 3, "drawTitle": "Chris Barnard & Hartoorplanting (1967)", "text": "3 Desember 1967: Prof. Chris Barnard plant die wêreld se heel eerste menslike hart oor by Groote Schuur!", "code": "drawMedicine(3)"}]}, "practice": [{"q": "STRIKVRAAG: Waarteen werk antibiotika soos penisillien?", "options": ["Teen alle virusse soos verkoue en griep", "Slegs teen bakterieë", "Teen hoofpyn en koors", "Teen gebreekte bene"], "answer": 1, "expl": "Antibiotika werk SLEGS teen bakterieë — NOOIT teen virusse soos griep nie!"}, {"q": "Wie het op 3 Desember 1967 in Kaapstad die wêreld se eerste menslike hartoorplanting uitgevoer?", "options": ["Dr. Louis Pasteur", "Dr. Alexander Fleming", "Prof. Chris Barnard", "Dr. Joseph Lister"], "answer": 2, "expl": "Prof. Chris Barnard by Groote Schuur-hospitaal!"}]}, {"id": "les_m2_breuke", "mid": "m2", "subject": "Wiskunde V1", "title": "Gewone Breuke: Tellers & Noemers", "subtitle": "Verstaan breuke met pizza en sjokolade sonder enige hoofbrekens!", "icon": "🍕", "concept": "Wat is 'n breuk eintlik?", "analogy7yo": "Dink aan 'n ronde pizza wat in 8 gelyke snye gesny is. Die Noemer (onderste getal) NOEM hoeveel snye die hele pizza maak. Die Teller (boonste getal) TEL hoeveel snye jy op jou bord het!", "methods": [{"title": "Metode 1: Die Pizza & Sjokolade Storie 🍕", "desc": "Stel voor jy het 'n sjokoladebalk met 8 blokkies. As Shenique 3 blokkies vat, het sy 3 uit 8 (3/8). Die onderste getal verander NOOIT as jy net optel of aftrek nie, want die boksie bly in 8 dele gesny!", "rule": "As noemers dieselfde is: Tel net die boonste getalle bymekaar! 3/8 + 2/8 = 5/8."}, {"title": "Metode 2: Die Stap-vir-Stap Resep 📋", "desc": "Stap 1: Kyk na die onderkant (noemers). Is hulle dieselfde? Los die onderkant presies net so!\nStap 2: Doen die bewerking net met die boonste getalle (tellers).\nStap 3: Vereenvoudig as jy kan (deel bo en onder deur dieselfde getal, bv. 4/8 ÷ 4 = 1/2).", "rule": "Onthou: Noemer = Naam van die soort deel. Teller = Aantal dele."}, {"title": "Metode 3: Die Visuele Blokke Truuk 🧱", "desc": "Teken 'n reghoek met 4 boksies. Kleur 1 boksie in = 1/4. Kleur nog 2 boksies in = 3/4. Jy kan met jou oë sien dat daar 1 wit boksie oor is (1/4 bly oor).", "rule": "1 hele = 4/4 of 8/8 of 10/10. Enigiets gedeel deur homself is 1 hele!"}], "video": {"title": "Witbord-Klas: Breuke Eenvoudig Verduidelik", "canvasType": "pizza", "steps": [{"step": 1, "drawTitle": "Die Hele Pizza", "text": "Hier is 'n hele pizza. Ons sny dit in 8 gelyke snye.", "code": "drawPizza(8, 0)"}, {"step": 2, "drawTitle": "Teller vs Noemer", "text": "Shenique vat 3 snye. Bo = 3 (Teller). Onder = 8 (Noemer). Breuk = 3/8.", "code": "drawPizza(8, 3)"}, {"step": 3, "drawTitle": "Optelling van Breuke", "text": "Shenique vat nog 2 snye. 3/8 + 2/8 = 5/8. Saam is 5 uit 8 snye geëet!", "code": "drawPizza(8, 5)"}, {"step": 4, "drawTitle": "Wat bly oor?", "text": "Daar bly 3 snye oor: 8/8 - 5/8 = 3/8 vir Pa Kevern!", "code": "drawPizza(8, 5, true)"}]}, "practice": [{"q": "Wat noem ons die onderste getal van 'n breuk?", "options": ["Teller", "Noemer", "Faktor", "Veelvoud"], "answer": 1, "expl": "Die Noemer staan onder — hy NOEM hoeveel dele die hele ding in verdeel is!"}, {"q": "Bereken: 2/7 + 3/7", "options": ["5/14", "5/7", "6/7", "1/7"], "answer": 1, "expl": "Die noemers is dieselfde (7). Tel net die tellers bymekaar: 2 + 3 = 5, so die antwoord is 5/7!"}]}, {"id": "les_m2_persentasies", "mid": "m2", "subject": "Wiskunde V1", "title": "Persentasies & Desimale: Die 100-Sent Truuk", "subtitle": "Dink aan 'n R1-muntstuk met 100 sente en jy sal dit nooit weer vergeet nie!", "icon": "💯", "concept": "Wat beteken 'persent' (%) regtig?", "analogy7yo": "'Per-sent' beteken letterlik 'uit 100 sent'. Dink aan 'n R1-muntstuk met 100 sente. As jy 50 sent het, het jy 50% van 'n rand (wat 0,50 of die helfte is!).", "methods": [{"title": "Metode 1: Die Geld-Analogie 💰", "desc": "R1 = 100 sent = 100%. \n50 sent = 50% = R0,50 = 1/2.\n25 sent = 25% = R0,25 = 1/4.\n75 sent = 75% = R0,75 = 3/4.\n10 sent = 10% = R0,10 = 1/10.", "rule": "As jy persentasie sien, dink altyd aan sente uit 'n 100-sent rand!"}, {"title": "Metode 2: Die Breuk na Persentasie Reël 📋", "desc": "Om enige breuk na 'n persentasie te verander: Maak die onderkant gelyk aan 100!\nVoorbeeld: 3/5. Vermenigvuldig onder met 20 om 100 te kry. Vermenigvuldig bo ook met 20: 3 × 20 = 60. Dus: 60/100 = 60%!", "rule": "Wat jy onder doen, MOET jy bo ook doen!"}, {"title": "Metode 3: Persentasie van 'n Bedrag 🧮", "desc": "Vraag: Wat is 20% van R150?\nTruuk: 10% van enige getal is maklik — skuif net die komma een plekkie links! 10% van R150 = R15.\nNou verdubbel jy dit net vir 20%: R15 × 2 = R30!", "rule": "Kry eers 10% (deel deur 10), en maal dan met wat jy nodig het!"}], "video": {"title": "Witbord-Klas: Persentasies sonder Sukkel", "canvasType": "percentage_grid", "steps": [{"step": 1, "drawTitle": "Die 100-Blokkies Rooster", "text": "Hier is 'n 10x10 rooster met presies 100 blokkies. Die hele rooster = 100%.", "code": "drawGrid100(0)"}, {"step": 2, "drawTitle": "Kleur 50 Blokkies in", "text": "Kleur die helfte in = 50 blokkies = 50% = 0,50 = 1/2.", "code": "drawGrid100(50)"}, {"step": 3, "drawTitle": "Kleur 25 Blokkies in", "text": "'n Kwart van die rooster = 25 blokkies = 25% = 0,25 = 1/4.", "code": "drawGrid100(25)"}, {"step": 4, "drawTitle": "Vinnige 10% Truuk", "text": "10% van R200? Skuif die nul af: R20! 20% = R40. 30% = R60.", "code": "drawGrid100(10)"}]}, "practice": [{"q": "Wat is 50% van R80?", "options": ["R40", "R20", "R50", "R8"], "answer": 0, "expl": "50% is presies die helfte! Die helfte van R80 is R40."}, {"q": "Skryf 3/10 as 'n persentasie:", "options": ["3%", "13%", "30%", "300%"], "answer": 2, "expl": "3/10 = 30/100 = 30%!"}]}, {"id": "les_m2_hoeke", "mid": "m2", "subject": "Wiskunde V1", "title": "Hoeke & Gradeboë: Skerp, Reg, Stomp & Gestrek", "subtitle": "Kyk na jou arm of 'n skêr om enige hoek dadelik te herken!", "icon": "📐", "concept": "Wat is 'n hoek en hoe meet ons dit?", "analogy7yo": "Dink aan 'n krokodil se bek. As sy bek net 'n klein bietjie oop is sodat hy jou kan knyp, is dit 'n SKERPHOEK (< 90°). As sy bek presies soos die hoek van 'n kamerkas staan, is dit 'n REGTE HOEK (90°). As hy sy bek wawyd oopmaak, is dit 'n STOMPHOEK (> 90°). As sy bek heeltemal plat oopval soos 'n liniaal, is dit 'n GESTREKTE HOEK (180°)!", "methods": [{"title": "Metode 1: Die Krokodilbek Analogie 🐊", "desc": "• Skerphoek: Tussen 0° en 89° (klein en skerp soos 'n potloodpunt).\n• Regte hoek: Presies 90° (lyk soos die letter L).\n• Stomphoek: Tussen 91° en 179° (vet en oop).\n• Gestrekte hoek: Presies 180° ('n reguit plat lyn).\n• Omwenteling: 360° (een volle sirkeldraai).", "rule": "Regte hoek = 90° (altyd gemerk met 'n klein vierkantige blokkie in die hoek!)."}, {"title": "Metode 2: Die Gradeboog-Gids Stap-vir-Stap 📋", "desc": "Stap 1: Sit die kruisie (middelpunt) van die gradeboog presies op die hoekpunt (hoekie van die twee lyne).\nStap 2: Maak seker die onderste 0°-lyn lê plat op die een been van die hoek.\nStap 3: Volg die boog van nul af (0, 10, 20...) tot waar die ander been wys. Moenie die verkeerde stel syfers lees nie — begin ALTYD by 0° op die been!", "rule": "Vra jouself altyd af: Lyk die hoek skerp (<90°) of stomp (>90°)? Dit keer dat jy 140° lees in plaas van 40°!"}, {"title": "Metode 3: Die Horlosie-Wysers Truuk ⏰", "desc": "Kyk na 'n horlosie:\n• 3-uur = 90° (Regte hoek)\n• 2-uur = 60° (Skerphoek)\n• 4-uur = 120° (Stomphoek)\n• 6-uur = 180° (Gestrekte lyn)\n• Volle rondte = 360°", "rule": "Elke uur op 'n horlosie is presies 30° (360 ÷ 12 = 30°)."}], "video": {"title": "Witbord-Klas: Meet Hoeke met die Gradeboog", "canvasType": "angles", "steps": [{"step": 1, "drawTitle": "Die Regte Hoek (90°)", "text": "Kyk na hierdie perfekte L-vorm. Dit meet presies 90° en het 'n blokkie in die hoek.", "code": "drawAngle(90)"}, {"step": 2, "drawTitle": "Die Skerphoek (<90°)", "text": "Wanneer die bene nader aan mekaar beweeg (bv. 45°), is dit 'n SKERPHOEK.", "code": "drawAngle(45)"}, {"step": 3, "drawTitle": "Die Stomphoek (>90°)", "text": "Wanneer die bene wyer as 90° oopgaan (bv. 135°), is dit 'n STOMPHOEK.", "code": "drawAngle(135)"}, {"step": 4, "drawTitle": "Gestrekte Hoek (180°)", "text": "'n Reguit lyn meet presies 180°. Twee regte hoeke saam maak 'n gestrekte hoek (90° + 90° = 180°).", "code": "drawAngle(180)"}]}, "practice": [{"q": "Watter soort hoek is 115°?", "options": ["Skerphoek", "Regte hoek", "Stomphoek", "Gestrekte hoek"], "answer": 2, "expl": "115° is groter as 90° maar kleiner as 180°, so dit is 'n STOMPHOEK!"}, {"q": "Hoeveel grade is daar in 'n volle omwenteling (sirkel)?", "options": ["90°", "180°", "270°", "360°"], "answer": 3, "expl": "'n Volle omwenteling reg rondom is altyd presies 360°."}]}, {"id": "les_m2_euler", "mid": "m2", "subject": "Wiskunde V1", "title": "3D-Voorwerpe & Euler se Formule (V + G - R = 2)", "subtitle": "Die tower-formule wat op ELKE prisma en piramide in die wêreld werk!", "icon": "📦", "concept": "Wat is Vlakke, Hoekpunte en Rande?", "analogy7yo": "Dink aan 'n kartonboksie:\n• Vlakke (V) = Die plat karton kante wat jy kan verf.\n• Hoekpunte / Punte (G) = Die skerp gom-kolletjies op die hoekies wat jou kan steek.\n• Rande (R) = Die reguit rante waar twee vlakke mekaar ontmoet.", "methods": [{"title": "Metode 1: Die Tower-Formule V + G - R = 2 🔮", "desc": "Leonhard Euler het ontdek dat vir enige veelvlak:\nVlakke + Hoekpunte MINUS Rande gelyk is aan 2!\nVoorbeeld by 'n Kubus / Reghoekige Prisma:\n• Vlakke = 6 (bo, onder, 4 kante)\n• Hoekpunte = 8 (4 bo, 4 onder)\n• Rande = 12 (4 bo, 4 onder, 4 staanders)\nToets Euler: 6 + 8 - 12 = 14 - 12 = 2! Dit werk ALTYD!", "rule": "Formule: V + G - R = 2 (Onthou: Vrede En Geluk Regeer = 2!)."}, {"title": "Metode 2: Prisma vs Piramide Herkenning 🏰", "desc": "• Prisma: Het TWEE identiese plat ente (bv. driehoekige prisma het 2 driehoeke voor en agter) en reghoekige kante.\n• Piramide: Het EEN basis onder (bv. vierkant) en al die kante is driehoeke wat by EEN skerp toppunt (apeks) bymekaarkom!", "rule": "Prisma = tonnel met 2 dieselfde deure. Piramide = tent met 1 skerp punt bo."}, {"title": "Metode 3: Silinder, Keël & Sfeer (Nie-veelvlakke) ⚽", "desc": "• Silinder: 2 plat sirkelvlakke en 1 geronde oppervlak (soos 'n blikkie Coke).\n• Keël: 1 plat sirkelvlak en 1 punt bo (soos 'n roomystorinkie).\n• Sfeer: 0 plat vlakke, 0 rande, 0 hoekpunte (soos 'n sokkerbal).", "rule": "Euler se formule geld net vir veelvlakke met PLAT vlakke en REGUIT rande!"}], "video": {"title": "Witbord-Klas: Bou 'n Kubus & Tel met Euler", "canvasType": "cube3d", "steps": [{"step": 1, "drawTitle": "Vlakke van 'n Kubus (V = 6)", "text": "Kyk na die 6 plat velle papier wat die kante maak: bo, onder, voor, agter, links, regs.", "code": "drawCubeFaces(6)"}, {"step": 2, "drawTitle": "Hoekpunte (G = 8)", "text": "Kyk na die 8 skerp hoekies: 4 bo en 4 onder.", "code": "drawCubeVertices(8)"}, {"step": 3, "drawTitle": "Rande (R = 12)", "text": "Tel die 12 reguit lyne wat die raamwerk vorm: 4 bo, 4 onder, 4 regop lyne.", "code": "drawCubeEdges(12)"}, {"step": 4, "drawTitle": "Toets Euler", "text": "V + G - R = 6 + 8 - 12 = 14 - 12 = 2! Die tower-formule is bewys!", "code": "drawEulerResult(2)"}]}, "practice": [{"q": "'n Veelvlak het 5 vlakke en 6 hoekpunte. Hoeveel rande het hy volgens Euler?", "options": ["7", "8", "9", "10"], "answer": 2, "expl": "V + G - R = 2. Dus: 5 + 6 - R = 2 -> 11 - R = 2 -> R = 9 rande!"}, {"q": "Hoeveel plat vlakke het 'n silinder?", "options": ["0", "1", "2", "3"], "answer": 2, "expl": "'n Silinder het 2 plat sirkelvlakke (bo en onder) en 1 geronde oppervlak."}]}, {"id": "les_m2_omtrek_oppervl", "mid": "m2", "subject": "Wiskunde V1", "title": "Omtrek, Oppervlakte & Volume", "subtitle": "Moet nooit weer omtrek en oppervlakte verwar nie — hier is die geheim!", "icon": "📏", "concept": "Wat is die verskil tussen Omtrek, Oppervlakte en Volume?", "analogy7yo": "• Omtrek (1D) = Die draadheining reg rondom die tuin (jy stap om die rand).\n• Oppervlakte (2D) = Die gras binne-in die tuin wat jy moet sny (vierkante blokkies, cm²).\n• Volume (3D) = Hoeveel water die swembad kan volmaak (kubieke blokkies, cm³ of liter)!", "methods": [{"title": "Metode 1: Die Tuin-Analogie 🏡", "desc": "Stel voor jy het 'n reghoekige tuin van 5 meter lank en 3 meter breed:\n• Omtrek: Stap al 4 kante: 5m + 3m + 5m + 3m = 16 meter heining.\n• Oppervlakte: Maal lengte met breedte: 5m × 3m = 15 vierkante meter (15 m²) gras.\n• Volume: As jy die tuin 2m diep uitgrawe vir 'n swembad: Lengte × Breedte × Hoogte = 5 × 3 × 2 = 30 kubieke meter (30 m³) water!", "rule": "Omtrek = plus al die kante. Oppervlakte = l × b. Volume = l × b × h."}, {"title": "Metode 2: Die Eenheid-Geheim 🏷️", "desc": "Kyk na die klein getalletjie by die maateenheid:\n• Omtrek: net cm of m (1 dimensie — reguit lyn).\n• Oppervlakte: cm² of m² (die klein ² beteken 2 dimensies: lengte × breedte!).\n• Volume: cm³ of m³ (die klein ³ beteken 3 dimensies: lengte × breedte × hoogte!).", "rule": "As 'n toets vra vir oppervlakte, MOET jou antwoord 'n klein ² hê (bv. cm²)!"}, {"title": "Metode 3: Vierkante Blokkies Tel Truuk 🔲", "desc": "Op 'n ruitnetrooster: Tel eenvoudig hoeveel vol vierkantjies binne-in die vorm pas! As daar 2 halwe blokkies is, sit hulle bymekaar om 1 vol blokkie te maak.", "rule": "1 vol blokkie = 1 cm²."}], "video": {"title": "Witbord-Klas: Omtrek vs Oppervlakte Uitgeteken", "canvasType": "perimeter_area", "steps": [{"step": 1, "drawTitle": "Teken die Reghoek (6 cm by 4 cm)", "text": "Hier is 'n reghoek: Lengte = 6 cm, Breedte = 4 cm.", "code": "drawRect(6, 4)"}, {"step": 2, "drawTitle": "Bereken Omtrek (Heining)", "text": "Stap om die rand: 6 + 4 + 6 + 4 = 20 cm.", "code": "drawPerimeter(6, 4)"}, {"step": 3, "drawTitle": "Bereken Oppervlakte (Gras)", "text": "Kleur die blokkies in: 6 × 4 = 24 vierkante blokkies (24 cm²).", "code": "drawArea(6, 4)"}, {"step": 4, "drawTitle": "Maak dit 3D (Volume)", "text": "Trek dit op met 2 cm hoogte: 24 cm² × 2 cm = 48 cm³ blokkies!", "code": "drawVolume(6, 4, 2)"}]}, "practice": [{"q": "Wat is die oppervlakte van 'n reghoek van 7 cm lank en 4 cm breed?", "options": ["11 cm²", "22 cm²", "28 cm²", "28 cm"], "answer": 2, "expl": "Oppervlakte = lengte × breedte = 7 cm × 4 cm = 28 cm² (onthou die cm²)!"}, {"q": "Wat is die omtrek van 'n vierkant met sye van 5 cm elk?", "options": ["10 cm", "20 cm", "25 cm²", "20 cm²"], "answer": 1, "expl": "'n Vierkant het 4 gelyke sye: 5 + 5 + 5 + 5 = 20 cm."}]}, {"id": "les_m6_lang_maal", "mid": "m6", "subject": "Wiskunde V2", "title": "Lang Vermenigvuldiging (3-syfer × 2-syfer)", "subtitle": "Die geheim van die 'Tower-Nul' wat almal altyd vergeet!", "icon": "✖️", "concept": "Hoe vermenigvuldig ons groot getalle soos 346 × 25?", "analogy7yo": "Dink aan 'n tweeling wat verjaar. As jy 346 pakkies lekkers moet uitdeel aan 25 kinders, deel jy eers uit aan die 5 meisies (die ene). Dan deel jy uit aan die 20 seuns (die tiene). Omdat die seuns in spanne van tien staan, sit jy ALTYD 'n 'tower-nul' as wag voor die deur!", "methods": [{"title": "Metode 1: Die Tower-Nul Kolommetode 🏰", "desc": "Kom ons doen 346 × 25:\nRondte 1 (Maal met 5): \n• 5 × 6 = 30 (skryf 0, dra 3 boontoe)\n• 5 × 4 = 20 + 3 = 23 (skryf 3, dra 2)\n• 5 × 3 = 15 + 2 = 17.\nEerste lyn = 1 730.\n\nRondte 2 (Maal met 2 tiene = 20):\n• SIT EERS 'N TOWER-NUL (0) REGS ONDER!\n• 2 × 6 = 12 (skryf 2, dra 1)\n• 2 × 4 = 8 + 1 = 9\n• 2 × 3 = 6.\nTweede lyn = 6 920.\n\nRondte 3: Tel die twee lyne bymekaar!\n1 730 + 6 920 = 8 650!", "rule": "Die #1 fout in eksamens: Mense vergeet die TOWER-NUL op die tweede ry!"}, {"title": "Metode 2: Die Uitgebreide Opbreek-Metode 📦", "desc": "Breek 25 op in 20 + 5:\n• 346 × 5 = 1 730\n• 346 × 20 = (346 × 2) met 'n nul agteraan = 692 met 'n nul = 6 920.\n• Tel bymekaar: 1 730 + 6 920 = 8 650.\nDit is presies dieselfde som, maar sonder dat jy deurmekaar raak met kolomme!", "rule": "Maal met tiene is net maal met die syfer, en sit 'n 0 agteraan."}, {"title": "Metode 3: Die Skattings-Toets (Is my antwoord naby?) 🎯", "desc": "Voor jy begin, skat die antwoord:\n346 is naby aan 350. 25 is 25.\n350 × 20 = 7 000. So die antwoord moet iewers naby 8 000 tot 9 000 wees.\nAs jou antwoord 865 of 86 500 is, weet jy dadelik jy het 'n nul gemis of te veel gesit!", "rule": "Skat altyd eers sodat jy dadelik 'n dom fout kan vang!"}], "video": {"title": "Witbord-Klas: 346 × 25 Stap-vir-Stap Geteken", "canvasType": "multiplication", "steps": [{"step": 1, "drawTitle": "Stel die Kolomme op", "text": "Skryf 346 bo en 25 onder. Trek 'n lyn.", "code": "drawMultStep(1)"}, {"step": 2, "drawTitle": "Maal met die Ene (5)", "text": "346 × 5 = 1 730. Kyk hoe dra ons die 3 en die 2 boontoe in pienk.", "code": "drawMultStep(2)"}, {"step": 3, "drawTitle": "DIE TOWER-NUL!", "text": "VOOR jy met 2 maal, skryf 'n vet goue 0 onder die heel regterste syfer!", "code": "drawMultStep(3)"}, {"step": 4, "drawTitle": "Maal met 2 & Tel By", "text": "346 × 2 = 692 (met die nul = 6 920). 1 730 + 6 920 = 8 650. Volpunte!", "code": "drawMultStep(4)"}]}, "practice": [{"q": "Waarom sit ons 'n nul (0) op die tweede ry wanneer ons met 34 maal?", "options": ["Omdat die som mooi moet lyk", "Omdat die 3 eintlik 30 (tiene) verteenwoordig", "Omdat 0 niks werd is nie", "Dit is nie nodig nie"], "answer": 1, "expl": "Die 3 in 34 staan in die tiene-kolom (dit is 30), so ons moet met 'n nul begin!"}, {"q": "Bereken: 125 × 10", "options": ["125", "1 205", "1 250", "12 500"], "answer": 2, "expl": "Om met 10 te vermenigvuldig, skuif net 'n nul agteraan: 1 250!"}]}, {"id": "les_m6_lang_deling", "mid": "m6", "subject": "Wiskunde V2", "title": "Lang Deling: Die D-V-A-B Gesin", "subtitle": "Onthou: Daddy, Mommy, Sister, Brother (Deel, Vermenigvuldig, Aftrek, Bring af)!", "icon": "➗", "concept": "Hoe doen 'n mens lang deling sonder om te huil?", "analogy7yo": "Dink aan 'n gesin wat 'n groot koek verdeel:\n1. Daddy (D) = Deel (Hoeveel keer gaan hy in?)\n2. Mommy (M) = Maal / Vermenigvuldig (Maal terug om te kyk)\n3. Sister (S) = Skrap / Aftrek (Trek af om te sien wat oorbly)\n4. Brother (B) = Bring af (Bring die volgende syfer af langs die res)\nEn dan begin Daddy weer van voor af!", "methods": [{"title": "Metode 1: Die D-V-A-B Trap-Reël 👨‍👩‍👧‍👦", "desc": "Kom ons deel 576 ÷ 4:\n• Stap 1 (Daddy Deel): 4 gaan in 5 in = 1 keer (skryf 1 bo).\n• Stap 2 (Mommy Maal): 1 × 4 = 4 (skryf 4 onder die 5).\n• Stap 3 (Sister Aftrek): 5 - 4 = 1.\n• Stap 4 (Brother Bring af): Bring die 7 af langs die 1 -> word 17.\nHERHAAL NOU:\n• Deel: 4 gaan in 17 in = 4 keer (skryf 4 bo).\n• Maal: 4 × 4 = 16.\n• Aftrek: 17 - 16 = 1.\n• Bring af: Bring die 6 af -> word 16.\n• Deel: 4 gaan in 16 in = 4 keer (skryf 4 bo).\n• Maal: 4 × 4 = 16. Aftrek: 16 - 16 = 0!\nAntwoord bo = 144 sonder res!", "rule": "Onthou die volgorde: Deel -> Maal -> Aftrek -> Bring af!"}, {"title": "Metode 2: Die Stukke-Hap Metode (Vriendelike Getalle) 🍰", "desc": "As die kolomme jou bangmaak, hap groot vriendelike stukke af van 576 ÷ 4:\n• Hap 1: 4 × 100 = 400. Trek af: 576 - 400 = 176 bly oor.\n• Hap 2: 4 × 40 = 160. Trek af: 176 - 160 = 16 bly oor.\n• Hap 3: 4 × 4 = 16. Trek af: 16 - 16 = 0.\nTel nou jou happe bymekaar: 100 + 40 + 4 = 144!", "rule": "Hierdie metode gee presies dieselfde antwoord en jy kan nooit 'n fout maak nie!"}, {"title": "Metode 3: Deelbaarheids-Truuk voor jy begin 🔍", "desc": "Is 576 deelbaar deur 4?\nKyk net na die laaste TWEE syfers: 76. 76 ÷ 4 = 19 (deelbaar!). So jy weet voor jy begin dat daar GEEN res gaan wees nie!", "rule": "As 'n getal se laaste 2 syfers deur 4 kan deel, deel die hele getal sonder res."}], "video": {"title": "Witbord-Klas: Lang Deling met D-V-A-B", "canvasType": "division", "steps": [{"step": 1, "drawTitle": "Teken die Delingshuisie", "text": "Sit 4 buite voor die deur en 576 binne-in die huisie.", "code": "drawDivStep(1)"}, {"step": 2, "drawTitle": "Daddy Deel & Mommy Maal", "text": "4 gaan in 5 in 1 keer. 1 × 4 = 4. 5 - 4 = 1.", "code": "drawDivStep(2)"}, {"step": 3, "drawTitle": "Brother Bring Af", "text": "Bring 7 af langs die 1 -> 17. 4 gaan in 17 in 4 keer (16). Res = 1.", "code": "drawDivStep(3)"}, {"step": 4, "drawTitle": "Laaste Stap", "text": "Bring 6 af -> 16. 4 × 4 = 16. Geen res. Antwoord bo op die dak = 144!", "code": "drawDivStep(4)"}]}, "practice": [{"q": "Wat is die 4 stappe van lang deling in die regte volgorde?", "options": ["Aftrek, Maal, Deel, Bring af", "Deel, Maal, Aftrek, Bring af", "Bring af, Deel, Maal, Aftrek", "Maal, Deel, Bring af, Aftrek"], "answer": 1, "expl": "D-V-A-B: Daddy Deel, Mommy Maal, Sister Aftrek, Brother Bring af!"}, {"q": "Wat is 100 ÷ 4?", "options": ["20", "25", "30", "50"], "answer": 1, "expl": "Vier 25-sent stukkies maak 100 sent (R1), so 100 ÷ 4 = 25!"}]}, {"id": "les_m3_voegwoorde", "mid": "m3", "subject": "Afrikaans Huistaal", "title": "Voegwoorde: Groep 1, 2 en die Stert-Toe Reël!", "subtitle": "Hoekom sommige werkwoorde soos skoothondjies heel agtertoe hardloop!", "icon": "🐕", "concept": "Wat gebeur met werkwoorde as ons twee sinne verbind?", "analogy7yo": "Dink aan werkwoorde as klein hondjies:\n• Groep 1 (EMOW): Die hondjie bly rustig sit waar hy is (geen verandering).\n• Groep 2: Die hondjie spring dadelik reg langs die voegwoord in!\n• Groep 3: Die voegwoord blaas 'n skerp fluitjie en die hondjie skrik en hardloop heel tot by die STERT van die sin!", "methods": [{"title": "Metode 1: Die 3 Groepe Reël 🚦", "desc": "• GROEP 1 (EMOW): En, Maar, Of, Want.\nGeen skuif! Sit net die woord tussenin met 'n komma voor maar en want.\nVoorbeeld: Piet leer hard, WANT hy wil slaag.\n\n• GROEP 2 (Dadelik na voegwoord): Daarom, Al, Nietemin, Nogtans, Toe.\nWerkwoord kom DADELIK na die voegwoord!\nVoorbeeld: Piet leer hard; daarom SAL hy slaag.\n\n• GROEP 3 (Stert-toe!): Omdat, Dat, Aangesien, Terwyl, Toe, As, Alhoewel.\nWerkwoord hardloop HEEL AGTERTOE na die stert!\nVoorbeeld: Piet leer hard OMDAT hy wil SLAAG.", "rule": "As jy OMDAT of DAT sien: Soek die werkwoord en jaag hom na die heel laaste woord voor die punt!"}, {"title": "Metode 2: Wat van 'het' en 'ge-' in Groep 3? 🐾", "desc": "Wat as die sin in die verlede tyd is?\nSin A: Piet is moeg.\nSin B: Hy HET gister hard GELEER.\nVerbind met OMDAT:\n'Piet is moeg omdat hy gister hard GELEER HET.'\nDie 'HET' hardloop heel agtertoe, reg na die ge-woord!", "rule": "In Groep 3 kom ge-woord en dan 'het' heel laaste: '...gesien het', '...gedoen het'."}, {"title": "Metode 3: Die Komma-Geheim 🛑", "desc": "Waar kom die komma?\n• Komma voor WANT en MAAR: '..., want...' en '..., maar...'\n• Komma-punt voor Groep 2: '...; daarom...'\n• Geen komma voor EN en OF nie!", "rule": "Want en Maar kry altyd 'n kommatjie voor hulle neus!"}], "video": {"title": "Witbord-Klas: Voegwoorde & die Stert-Hondjie", "canvasType": "conjunctions", "steps": [{"step": 1, "drawTitle": "Twee Los Sinne", "text": "Sin 1: Shenique is bly. Sin 2: Sy KRY 'n goeie punt.", "code": "drawConjStep(1)"}, {"step": 2, "drawTitle": "Groep 1 (Want)", "text": "Shenique is bly, want sy kry 'n goeie punt. (Geen skuif, net komma voor want).", "code": "drawConjStep(2)"}, {"step": 3, "drawTitle": "Groep 3 (Omdat)", "text": "Shenique is bly OMDAT sy 'n goeie punt KRY. (Kyk hoe hardloop KRY na die stert!).", "code": "drawConjStep(3)"}]}, "practice": [{"q": "Verbind met OMDAT: 'Ek drink water. Ek is dors.'", "options": ["Ek drink water omdat ek is dors.", "Ek drink water omdat is ek dors.", "Ek drink water omdat ek dors is.", "Ek drink water, want ek dors is."], "answer": 2, "expl": "Omdat is Groep 3! Die werkwoord 'is' hardloop na die stert van die sin: '...omdat ek dors IS.'"}, {"q": "Watter voegwoorde kry ALTYD 'n komma voor hulle?", "options": ["En en Of", "Want en Maar", "Omdat en Dat", "Aangesien en Toe"], "answer": 1, "expl": "Want en Maar kry altyd 'n komma voor hulle neus!"}]}, {"id": "les_m3_tmp", "mid": "m3", "subject": "Afrikaans Huistaal", "title": "Bywoorde: Tannie Maria Pretorius (T-M-P)", "subtitle": "Die volgorde in Afrikaanse sinne: Tyd, Manier, Plek!", "icon": "👵", "concept": "In watter volgorde sit ons beskrywende inligting in 'n sin?", "analogy7yo": "Ontmoet vir Tannie Maria Pretorius (T-M-P). Sy klim altyd eerste op die bus:\n1. T = TYD (Wanneer? Gister, om 3-uur, vanoggend)\n2. M = MANIER (Hoe? Vinnig, versigtig, met 'n glimlag)\n3. P = PLEK (Waar? By die skool, in die swembad, Pretoria toe)!", "methods": [{"title": "Metode 1: Tannie Maria Pretorius Reël 🚌", "desc": "Kyk na hierdie deurmekaar sin:\n'Shenique het skool toe (Plek) vinnig (Manier) vanoggend (Tyd) gehardloop.' Dit klink verkeerd!\nPas T-M-P toe:\n1. Tyd: vanoggend\n2. Manier: vinnig\n3. Plek: skool toe\nRegte sin: 'Shenique het VANOGGEND (T) VINNIG (M) SKOOL TOE (P) gehardloop.' Perfek!", "rule": "Volgorde is ALTYD: Wanneer -> Hoe -> Waar (T-M-P)!"}, {"title": "Metode 2: Die Vraelys-Truuk ❓", "desc": "Vra jouself af:\n• Vraag 1: Wanneer gebeur dit? Dit kom EERSTE (Tyd).\n• Vraag 2: Hoe doen sy dit? Dit kom TWEEDE (Manier).\n• Vraag 3: Waarnatoe of waar? Dit kom DERDE (Plek).", "rule": "Tyd staan altyd voor Plek in Afrikaans (anders as in Engels!)."}], "video": {"title": "Witbord-Klas: Die T-M-P Busrit", "canvasType": "tmp_bus", "steps": [{"step": 1, "drawTitle": "Sitplek 1: Tyd (T)", "text": "Wanneer? Gister, Nou, Om 4-uur.", "code": "drawTMP(1)"}, {"step": 2, "drawTitle": "Sitplek 2: Manier (M)", "text": "Hoe? Rustig, Singend, Vinnig.", "code": "drawTMP(2)"}, {"step": 3, "drawTitle": "Sitplek 3: Plek (P)", "text": "Waar? In die tuin, Hermanstad toe.", "code": "drawTMP(3)"}]}, "practice": [{"q": "Kies die regte T-M-P volgorde:", "options": ["Piet ry skool toe met sy fiets vanoggend.", "Piet ry vanoggend met sy fiets skool toe.", "Piet ry met sy fiets vanoggend skool toe.", "Piet ry skool toe vanoggend met sy fiets."], "answer": 1, "expl": "Vanoggend (Tyd) + met sy fiets (Manier) + skool toe (Plek) = T-M-P!"}]}, {"id": "les_m4_fanboys", "mid": "m4", "subject": "English FAL", "title": "Conjunctions: Meet the FANBOYS!", "subtitle": "How to join two simple sentences into a super compound sentence!", "icon": "🤼", "concept": "What are coordinating conjunctions?", "analogy7yo": "Imagine 7 cheerleaders holding hands between two strong sentences. Their names spell FANBOYS:\nF = For\nA = And\nN = Nor\nB = But\nO = Or\nY = Yet\nS = So!", "methods": [{"title": "Method 1: The FANBOYS Meaning Guide 🌟", "desc": "• AND = joins similar ideas ('I like cats AND I like dogs')\n• BUT = shows a surprise or difference ('She studied hard, BUT she was nervous')\n• OR = gives a choice ('You can have ice cream OR you can have cake')\n• SO = shows a result ('It was raining, SO we stayed inside')\n• BECAUSE (Subordinating) = gives a reason ('We stayed inside BECAUSE it rained').", "rule": "Put a comma before FANBOYS when joining two full sentences!"}, {"title": "Method 2: Because vs So (The Cause and Effect Flip) 🔄", "desc": "Look at how 'so' and 'because' are opposites:\n• 'Shenique was thirsty, SO she drank water.' (Result)\n• 'Shenique drank water BECAUSE she was thirsty.' (Reason)", "rule": "'Because' tells why. 'So' tells what happened next."}], "video": {"title": "Whiteboard Lesson: Mastering FANBOYS", "canvasType": "fanboys", "steps": [{"step": 1, "drawTitle": "Two Sentences", "text": "Sentence 1: Shenique likes netball. Sentence 2: Shenique likes hockey.", "code": "drawFanboys(1)"}, {"step": 2, "drawTitle": "Connect with BUT", "text": "Shenique likes netball, BUT Shenique likes hockey.", "code": "drawFanboys(2)"}, {"step": 3, "drawTitle": "Connect with SO", "text": "The test is tomorrow, SO they are studying today!", "code": "drawFanboys(3)"}]}, "practice": [{"q": "Choose the correct conjunction: 'I wanted to play outside, _____ it started to rain.'", "options": ["so", "but", "and", "or"], "answer": 1, "expl": "'But' shows a contrast or surprise — you wanted to play, BUT rain stopped you!"}]}, {"id": "les_m7_stroombane", "mid": "m7", "subject": "NW & Tegnologie", "title": "Elektriese Stroombane: Geslote vs Oop", "subtitle": "Elektrone is soos renmotors op 'n renbaan — as die brug oopstaan, stop alles!", "icon": "⚡", "concept": "Hoe vloei elektrisiteit in 'n stroombaan?", "analogy7yo": "Dink aan 'n renbaan vir karretjies (elektrone). Die battery is die petrolstasie wat hulle vorentoe stoot. Die drade is die pad. Die gloeilamp is die liggies langs die pad. As die skakelaar OOP is, is daar 'n gat in die brug en die karretjies kan nie ry nie (liggie is af). As die skakelaar GESLUIT is, is die pad heel en die karretjies jaag deur (liggie brand helder)!", "methods": [{"title": "Metode 1: Die Renbaan Analogie 🏎️", "desc": "• Geslote stroombaan: Die pad is heel sonder enige gapings. Elektrisiteit vloei van die positiewe (+) terminaal na die negatiewe (-) terminaal.\n• Oop stroombaan: Daar is 'n breek of die skakelaar is af. Geen stroom kan vloei nie!\n• Geleiers: Materiale wat die stroom laat deurgaan (koper, yster, aluminium, goud).\n• Isoleerders: Materiale wat die stroom keer sodat jy nie 'n skok kry nie (plastiek, rubber, glas, hout).", "rule": "Plastiek om 'n elektriese koord beskerm jou omdat plastiek 'n ISOLEERDER is!"}, {"title": "Metode 2: Die Simbole Geheuetruuk ✏️", "desc": "• Sel (battery): Twee parallelle lyne — lang dun strepie is (+) en kort vet strepie is (-).\n• Skakelaar: Twee sirkeltjies met 'n oop hekkie of toe hekkie.\n• Gloeilamp: 'n Sirkel met 'n kruisie (X) binne-in.\n• Geleidingsdraad: 'n Reguit lyn met 'n liniaal getrek.", "rule": "Onthou: 'n Battery bestaan uit TWEE of meer selle wat agtermekaar gekoppel is!"}], "video": {"title": "Witbord-Klas: Bou 'n Lewendige Stroombaan", "canvasType": "circuit", "steps": [{"step": 1, "drawTitle": "Die Battery & Drade", "text": "Ons begin met 'n sel. Die lang lyn is (+), die kort lyn is (-).", "code": "drawCircuit(1)"}, {"step": 2, "drawTitle": "Voeg die Skakelaar by (OOP)", "text": "Die hekkie staan oop. Geen elektrone kan vloei nie. Die lampie bly donker.", "code": "drawCircuit(2)"}, {"step": 3, "drawTitle": "Sluit die Skakelaar!", "text": "Kliek! Die hekkie maak toe. Elektrone vloei en die gloeilampie brand helder geel!", "code": "drawCircuit(3)"}]}, "practice": [{"q": "Watter van die volgende is 'n goeie GELEIER van elektrisiteit?", "options": ["Rubber", "Koperdraad", "Plastiek liniaal", "Glasbottel"], "answer": 1, "expl": "Koper is 'n metaal en 'n uitstekende geleier van elektrisiteit!"}, {"q": "Wat gebeur wanneer 'n skakelaar in 'n stroombaan OOPgemaak word?", "options": ["Die gloeilamp brand helderder", "Die stroombaan is onderbreek en die lamp gaan dood", "Die battery laai vinniger", "Die drade word warm"], "answer": 1, "expl": "'n Oop skakelaar beteken daar is 'n gaping in die pad — die stroom stop en die lamp gaan dood!"}]}, {"id": "les_m5_klimaat", "mid": "m5", "subject": "SW: Geografie", "title": "Reënwoude & Woestyne: Die 4 Lae", "subtitle": "Klimaatstreke, die groen reënwoud-dak en hoe plante in die woestyn oorleef!", "icon": "🌴", "concept": "Hoe pas plante en diere aan by reënwoude en warm woestyne?", "analogy7yo": "Dink aan 'n tropiese reënwoud soos 'n lewendige wolkekrabber van bome met 4 vloere:\n1. Bosvloer (Grondvloer): Donker en vogtig, vol miere, swamme en duisendpote wat dooie blare herwin.\n2. Onderlaag (1ste Vloer): Klein struike en jong boompies met reuse breë blare om enige straaltjie sonlig te vang.\n3. Blaredak / Canopy (2de Vloer - 30m hoog): 'n Digte groen sambreel waar 90% van alle ape, voëls en skoenlappers woon!\n4. Uitsteeklaag / Emergent (Dakwoonstel - 50m hoog): Enkele reusagtige bome wat bo die groen sambreel uitsteek om wind en weer te trotseer!", "methods": [{"title": "Metode 1: Die 4 Vloere van die Reënwoud 🏢", "desc": "Onthou van onder na bo:\n1. Bosvloer (Donker, 2% sonlig)\n2. Onderlaag (Breë blare)\n3. Blaredak (Canopy = die sambreel waar meeste lewe is)\n4. Uitsteeklaag (Emergents = die hoogste reuse).", "rule": "Die Blaredak (Canopy) vang die meeste sonlig en het die meeste dierelewe!"}, {"title": "Metode 2: Woestyn Aanpassings (Kaktus vs Kameel) 🐫", "desc": "• Woestyn: Baie warm bedags, yskoud snags, minder as 250mm reën per jaar.\n• Kaktus: Geen dun blare nie (om waterverlies te keer), dik vlesige stam wat water stoor, lang wortels wyd onder die grond.\n• Kameel: Breë voete wat nie in die sand wegsink nie, stoor vet in boggel, toe neusgate teen sandstorms.", "rule": "Kaktusse het dorings in plaas van blare sodat hulle nie water uitsweet nie!"}], "video": {"title": "Witbord-Klas: Die 4 Lae van die Reënwoud", "canvasType": "rainforest", "steps": [{"step": 1, "drawTitle": "Die Bosvloer & Onderlaag", "text": "Stap 1: Die donker bosvloer en onderlaag met reuse blare.", "code": "drawRainforest(1)"}, {"step": 2, "drawTitle": "Die Blaredak (Canopy)", "text": "Stap 2: Die digte groen sambreel op 30 meter hoog — die hart van die reënwoud!", "code": "drawRainforest(2)"}, {"step": 3, "drawTitle": "Die Uitsteeklaag (Emergents)", "text": "Stap 3: Reuse bome wat tot 50 meter hoog bokant alles uittroon!", "code": "drawRainforest(3)"}]}, "practice": [{"q": "Watter laag van die reënwoud vorm 'n digte groen sambreel waar 90% van alle dierelewe woon?", "options": ["Die bosvloer", "Die blaredak (canopy)", "Die onderlaag", "Die uitsteeklaag"], "answer": 1, "expl": "Die blaredak (canopy) is die hooflaag van die reënwoud!"}]}, {"id": "les_m8_noodhulp", "mid": "m8", "subject": "PSW", "title": "Noodhulp: R-Y-V-O & Brandwonde", "subtitle": "Wees 'n lewensredder! Hoe om verstuikings, brandwonde en neusbloeding reg te hanteer.", "icon": "🩹", "concept": "Wat is die goue noodhulp-reëls vir verstuikings en warmtee-brandwonde?", "analogy7yo": "Dink aan jou liggaam soos 'n brandweerwa wat vinnig en koel moet reageer:\n• As jou enkel swel na 'n val, onthou die Superhero RYVO:\n  R = Rus (moenie op die seer enkel trap nie!)\n  Y = Ys (sit ys in 'n doek vir 15 minute om swelsel te stop)\n  V = Verband (draai elastiese verband om vir stewigheid)\n  O = Oplig (lig die voet op 'n kussing bo jou hart sodat die bloed afloop)!\n• Vir brandwonde: KOEL DIT AF! Hou 10–20 minute onder koel lopende kraanwater. Moet NOOIT botter, olie of tandepasta opsmeer nie — dit bak die vel verder!", "methods": [{"title": "Metode 1: RYVO vir Verstuikings 🏃", "desc": "R - Rus die beseerde liggaamsdeel.\nY - Ys (draai ys in 'n lap toe, moenie kaal ys op vel sit nie).\nV - Verband (stewig maar nie te styf dat vingers blou word nie).\nO - Oplig (bo die vlak van die hart).", "rule": "R-Y-V-O = Rus, Ys, Verband, Oplig!"}, {"title": "Metode 2: Brandwonde & Neusbloeding 🩸", "desc": "• Brandwonde: Slegs koel lopende kraanwater (minstens 10-20 min). Geen botter/tandepasta nie!\n• Neusbloeding: Sit regop en leun VOORTOE (moenie agteroor leun nie, anders slik jy bloed!). Knyp die sagte deel van jou neus vir 10 minute toe en haal deur jou mond asem.", "rule": "Neusbloeding: Leun altyd VOORTOE, nooit agteroor nie!"}], "video": {"title": "Witbord-Klas: RYVO Noodhulp", "canvasType": "firstaid", "steps": [{"step": 1, "drawTitle": "R - Rus & Y - Ys", "text": "Stap 1: Rus die enkel en sit ys in 'n handdoek op die swelsel.", "code": "drawFirstAid(1)"}, {"step": 2, "drawTitle": "V - Verband & O - Oplig", "text": "Stap 2: Draai 'n verband om en lig die been op 'n sagte kussing bo die hart!", "code": "drawFirstAid(2)"}]}, "practice": [{"q": "Wat moet jy doen as iemand 'n warm water brandwond opdoen?", "options": ["Smeer dadelik botter of tandepasta op die wond", "Hou dit dadelik vir minstens 10–20 minute onder koel, lopende kraanwater", "Prik enige blase oop met 'n speld", "Vryf ysblokkies hard oor die vel"], "answer": 1, "expl": "Koel lopende water vir 10-20 minute is die enigste regte eerstehulp!"}]}];
